              def finish_wizard(self, install_newelle=True):
                  ui.CONF_DIR.mkdir(parents=True, exist_ok=True)
                  ui.FIRST_BOOT_FLAG.write_text("done\n", encoding="utf-8")
                  if not ui.STARTUP_FLAG.exists():
                      ui.set_startup(False)
                  self.startup_box.setChecked(ui.startup_enabled())
                  self.hub_title.setText("You're all set \U0001F389")
                  self.set_status("Press Super+Space any time to ask Gemini.")
                  self.go(3)
                  if install_newelle:
                      self.start_newelle_setup()

              def start_newelle_setup(self):
                  if launch([ui.NEWELLE_SETUP, "--install"]):
                      self.set_status("Setting up Newelle in a terminal window...")
                  else:
                      self.set_status("Could not start the Newelle setup.")

              def closeEvent(self, event):
                  try:
                      if not ui.FIRST_BOOT_FLAG.exists():
                          ui.CONF_DIR.mkdir(parents=True, exist_ok=True)
                          ui.FIRST_BOOT_FLAG.write_text("done\n", encoding="utf-8")
                  except OSError:
                      pass
                  super().closeEvent(event)

              def set_status(self, text):
                  self.status.setText(text)

