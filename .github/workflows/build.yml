              def _toggle_show(self, on):
                  self.field.setEchoMode(QLineEdit.EchoMode.Normal if on else QLineEdit.EchoMode.Password)
                  self.show_btn.setText("Hide" if on else "Show")

              def _say(self, text, color="#8C98BA"):
                  self.status.setStyleSheet("color: " + color + "; font-size: 12px;")
                  self.status.setText(text)

              def save(self):
                  key = self.field.text().strip()
                  if key:
                      ui.save_api_key(key)
                      self.field.clear()
                      self.field.setPlaceholderText("A key is saved - paste a new one to replace it")
                  return bool(key)

              def test(self):
                  key = self.field.text().strip() or ui.load_api_key()
                  if not key:
                      self._say("Paste a key first.", "#F87171")
                      return
                  self._say("Checking with Google...")
                  self.test_btn.setEnabled(False)
                  self._worker = ui.FuncWorker(ui.test_api_key, key)
                  self._worker.done.connect(self._tested)
                  self._worker.start()

              def _tested(self, result):
                  self.test_btn.setEnabled(True)
                  if isinstance(result, Exception):
                      self._say("\u2717 " + str(result), "#F87171")
                  else:
                      self._say("\u2713 Key works. Press Super+Space to try the assistant.", "#4ADE80")


