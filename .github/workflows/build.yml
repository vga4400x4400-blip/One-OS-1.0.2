          body: |
            ## OneOS v1.0.1 Release (Debian 13 Trixie amd64)
            - **Desktop Environment:** KDE Plasma 6 (`sddm`, `kwin-x11`, `dolphin`, `konsole`, Kvantum, Papirus-Dark) with complete XFCE purge.
            - **First-Boot Visual Profile Wizard:** Prompts on first login to choose between **✨ Liquid Glass Mode** (KWin acrylic blur, contrast, translucent Kvantum glass engine & translucent app rules) or **⚡ Sleek Obsidian Matte Mode** (ultra-smooth dark theme with 0.25x animations and zero GPU blur overhead).
            - **Low-End & VM Performance Optimisations:** Pre-configured ZRAM (`zstd`), tuned `sysctl` VM parameters, and disabled Baloo background file indexing.
            - **AI Features:** System-Wide Gemini Assistant (`Super + Space`) and Desktop Circle to Search (`Super + Shift + S`).
            - **Pre-installed Stack:** Multi-arch Wine (`amd64` + `i386`), Winetricks, Lutris, Brave Browser, Calamares Installer, and VM Guest Drivers.
          files: |
            OneOS-v1.0.1.iso*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
