            'xfce4*' \
            'xfwm4*' \
            'thunar*' \
            'xfce4-panel*' \
            'xfce4-session*' || true

          rm -f /usr/share/xsessions/*xfce*.desktop /usr/share/wayland-sessions/*xfce*.desktop

          echo "TASKSEL_DEFAULT=kde" > /etc/default/tasksel
          echo "/usr/sbin/sddm" > /etc/X11/default-display-manager
          ln -sf /lib/systemd/system/sddm.service /etc/systemd/system/display-manager.service

          if ! command -v kwriteconfig5 >/dev/null 2>&1 && command -v kwriteconfig6 >/dev/null 2>&1; then
            ln -sf /usr/bin/kwriteconfig6 /usr/local/bin/kwriteconfig5
          fi

          if ! command -v qdbus >/dev/null 2>&1; then
            if command -v qdbus6 >/dev/null 2>&1; then
              ln -sf /usr/bin/qdbus6 /usr/local/bin/qdbus
            elif [ -x /usr/lib/qt6/bin/qdbus ]; then
              ln -sf /usr/lib/qt6/bin/qdbus /usr/local/bin/qdbus
            elif [ -x /usr/lib/qt5/bin/qdbus ]; then
              ln -sf /usr/lib/qt5/bin/qdbus /usr/local/bin/qdbus
            fi
          fi

          echo "RESUME=none" > /etc/initramfs-tools/conf.d/resume
          update-initramfs -u -k all || true

          apt-get autoremove -y --purge || true
          apt-get clean
          rm -rf /var/lib/apt/lists/* /usr/share/doc/* /usr/share/man/* /tmp/*
          BRAVE_HOOK_EOF

          chmod 0755 config/hooks/normal/0500-oneos-customization.hook.chroot

          echo "[OneOS] Running lb build..."
          lb build

          ISO_FILE="$(find "${WORKDIR}" -maxdepth 1 -type f -name '*.iso' | head -n 1)"
          if [ -z "${ISO_FILE}" ]; then
            echo "[OneOS] ERROR: Live ISO image was not generated!" >&2
            exit 1
          fi

          mv -f "${ISO_FILE}" "/workspace/OneOS-v1.0.1.iso"
          ls -lh "/workspace/OneOS-v1.0.1.iso"
          echo "[OneOS] Successfully compiled /workspace/OneOS-v1.0.1.iso"
          BUILD_SCRIPT_EOF

