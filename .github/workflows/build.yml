              def make_choice(self, mode):
                  info = MODES[mode]
                  button = QPushButton()
                  button.setObjectName("Choice")
                  button.setCheckable(True)
                  button.setProperty("mode", mode)
                  button.setCursor(Qt.CursorShape.PointingHandCursor)
                  button.setMinimumHeight(300)
                  layout = QVBoxLayout(button)
                  layout.setContentsMargins(14, 14, 14, 14)
                  layout.setSpacing(8)

                  swatch = QFrame()
                  swatch.setFixedHeight(130)
                  swatch.setStyleSheet("QFrame#Swatch { background: " + info["bg"] + "; border-radius: 10px; }")
                  swatch.setObjectName("Swatch")
                  sl = QVBoxLayout(swatch)
                  sl.setContentsMargins(26, 22, 26, 0)
                  window = QFrame()
                  window.setObjectName("MockWindow")
                  window.setStyleSheet("QFrame#MockWindow { " + info["inner"] + " border-radius: 8px; }")
                  sl.addWidget(window)
                  layout.addWidget(swatch)

                  name_row = QHBoxLayout()
                  name = QLabel(info["name"])
                  name.setObjectName("CardName")
                  name_row.addWidget(name)
                  if mode == self.recommended:
                      badge = QLabel("RECOMMENDED")
                      badge.setObjectName("Badge")
                      name_row.addWidget(badge)
                  name_row.addStretch()
                  layout.addLayout(name_row)

                  desc = QLabel(info["desc"])
                  desc.setObjectName("Sub")
                  desc.setWordWrap(True)
                  desc.setAlignment(Qt.AlignmentFlag.AlignTop)
                  layout.addWidget(desc, 1)

                  for child in button.findChildren(QWidget):
                      child.setAttribute(Qt.WidgetAttribute.WA_TransparentForMouseEvents)
                  return button

