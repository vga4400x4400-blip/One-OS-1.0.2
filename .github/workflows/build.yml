          def stylesheet(glass):
              card = "rgba(16, 19, 32, 208)" if glass else "rgb(16, 19, 32)"
              border = "rgba(130, 175, 255, 120)" if glass else "rgb(54, 68, 112)"
              return STYLE.replace("@CARD_BG@", card).replace("@BORDER@", border)


          def _remove_pid():
              try:
                  if PID_FILE.read_text().strip() == str(os.getpid()):
                      PID_FILE.unlink()
              except OSError:
                  pass


          def single_instance(replace):
              """A second launch closes the open overlay (toggle). With replace=True it takes over instead."""
              try:
                  old_pid = int(PID_FILE.read_text().strip())
                  os.kill(old_pid, 0)
                  cmdline = Path("/proc/%d/cmdline" % old_pid).read_bytes()
                  if b"oneos-gemini-assistant" in cmdline and old_pid != os.getpid():
                      os.kill(old_pid, signal.SIGTERM)
                      if not replace:
                          return True
              except (OSError, ValueError):
                  pass
              try:
                  PID_FILE.write_text(str(os.getpid()))
                  atexit.register(_remove_pid)
              except OSError:
                  pass
              return False


          def encode_image(path):
              image = QImage(path)
              if image.isNull():
                  return None
              if max(image.width(), image.height()) > 1600:
                  image = image.scaled(
                      1600, 1600, Qt.AspectRatioMode.KeepAspectRatio, Qt.TransformationMode.SmoothTransformation
                  )
              data = QByteArray()
              buffer = QBuffer(data)
              buffer.open(QIODevice.OpenModeFlag.WriteOnly)
              image.save(buffer, "JPEG", 88)
              buffer.close()
              return base64.b64encode(bytes(data.data())).decode("ascii")


          def run_shell(cmd):
              try:
                  done = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=30)
                  output = ((done.stdout or "") + (done.stderr or "")).strip()
                  if not output:
                      output = "[finished with exit code %d]" % done.returncode
              except subprocess.TimeoutExpired:
                  output = "[timed out after 30 seconds]"
              if len(output) > 6000:
                  output = output[:6000] + "\n[... output truncated ...]"
              return "```\n$ " + cmd + "\n\n" + output.replace("```", "'''") + "\n```"


          class DragHeader(QFrame):
              def mousePressEvent(self, event):
                  if event.button() == Qt.MouseButton.LeftButton:
                      handle = self.window().windowHandle()
                      if handle is not None:
                          handle.startSystemMove()
                      event.accept()


          class Bubble(QFrame):
              def __init__(self, text, role, copyable=True):
                  super().__init__()
                  self.raw = text
                  self.setObjectName("UserBubble" if role == "user" else "AiBubble")
                  self.setMaximumWidth(MAX_BUBBLE_WIDTH)
                  layout = QVBoxLayout(self)
                  layout.setContentsMargins(13, 9, 13, 9)
                  layout.setSpacing(4)
                  self.label = QLabel()
                  self.label.setWordWrap(True)
                  self.label.setTextFormat(
                      Qt.TextFormat.PlainText if role == "user" else Qt.TextFormat.MarkdownText
                  )
                  self.label.setText(text)
                  self.label.setOpenExternalLinks(True)
                  self.label.setTextInteractionFlags(
                      Qt.TextInteractionFlag.TextSelectableByMouse | Qt.TextInteractionFlag.LinksAccessibleByMouse
                  )
                  layout.addWidget(self.label)
                  self.copy_btn = None
                  if role != "user" and copyable:
                      self.copy_btn = QPushButton("Copy")
                      self.copy_btn.setObjectName("Ghost")
                      self.copy_btn.setCursor(Qt.CursorShape.PointingHandCursor)
                      self.copy_btn.clicked.connect(self._copy)
                      layout.addWidget(self.copy_btn, alignment=Qt.AlignmentFlag.AlignRight)

              def set_text(self, text):
                  self.raw = text
                  self.label.setText(text)

              def _copy(self):
                  QGuiApplication.clipboard().setText(self.raw)
                  self.copy_btn.setText("Copied \u2713")
                  QTimer.singleShot(1300, lambda: self.copy_btn.setText("Copy"))


          class AssistantOverlay(QWidget):
              def __init__(self, image_path=None):
                  super().__init__()
                  self.glass = ui.current_visual_mode() == "glass"
                  self.history = []
                  self.image_b64 = encode_image(image_path) if image_path and os.path.isfile(image_path) else None
                  self.image_path = image_path if self.image_b64 else None
                  self.image_sent = False
                  self.busy = False
                  self.worker = None
                  self.thinking_row = None
                  self.thinking_bubble = None
                  self.dots = 0
                  self.last_text = ""
                  self.dot_timer = QTimer(self)
                  self.dot_timer.timeout.connect(self._tick)
                  self._build()

              # ------------------------------------------------------------ layout
              def _build(self):
                  self.setWindowTitle("OneOS Assistant")
                  self.setWindowFlags(
                      Qt.WindowType.FramelessWindowHint | Qt.WindowType.WindowStaysOnTopHint | Qt.WindowType.Tool
                  )
                  self.setAttribute(Qt.WidgetAttribute.WA_TranslucentBackground, True)
                  self.setStyleSheet(stylesheet(self.glass))
                  self.setFixedSize(692, 620)

                  geo = QApplication.primaryScreen().availableGeometry()
                  self.move(geo.x() + (geo.width() - self.width()) // 2, geo.y() + int(geo.height() * 0.08))

