            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/var/cache/apt/archives:/var/cache/apt/archives" \
            -w /workspace \
            debian:trixie \
            /bin/bash /workspace/build-oneos.sh

      - name: Verify ISO and Split Only If Over GitHub 2GB Limit
        run: |
          test -f "${GITHUB_WORKSPACE}/OneOS-v1.0.1.iso"
          sha256sum "${GITHUB_WORKSPACE}/OneOS-v1.0.1.iso" > "${GITHUB_WORKSPACE}/OneOS-v1.0.1.iso.sha256"
          ISO_BYTES=$(stat -c%s "${GITHUB_WORKSPACE}/OneOS-v1.0.1.iso")
          if [ "${ISO_BYTES}" -ge 2097152000 ]; then
            echo "ISO is ${ISO_BYTES} bytes (>= 2GB); splitting into 1900MB parts for GitHub Releases..."
            split -b 1900M -d "${GITHUB_WORKSPACE}/OneOS-v1.0.1.iso" "${GITHUB_WORKSPACE}/OneOS-v1.0.1.iso.part"
            rm -f "${GITHUB_WORKSPACE}/OneOS-v1.0.1.iso"
          fi
          ls -lh "${GITHUB_WORKSPACE}"/OneOS-v1.0.1.iso*

      - name: Publish OneOS v1.0.1 ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
