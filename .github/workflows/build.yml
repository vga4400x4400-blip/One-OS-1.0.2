              def refresh_tiles(self):
                  mode = ui.current_visual_mode()
                  if mode == "glass":
                      self.tile_appearance.set_texts("Appearance: Liquid Glass", "Click to switch to Sleek Obsidian")
                  else:
                      self.tile_appearance.set_texts("Appearance: Sleek Obsidian", "Click to switch to Liquid Glass")
                  if ui.load_api_key():
                      self.tile_key.set_texts("Gemini API key  \u2713", "Saved. Click to replace or test it")
                  else:
                      self.tile_key.set_texts("Gemini API key", "Not set. Click to add your free key")
                  if ui.newelle_installed():
                      self.tile_newelle.set_texts("Newelle AI  \u2713", "Open Newelle  \u00b7  quick window: Ctrl+Alt+N")
                  else:
                      self.tile_newelle.set_texts("Install Newelle AI", "Download and set up the full AI assistant")

              def toggle_mode(self):
                  new_mode = "obsidian" if ui.current_visual_mode() == "glass" else "glass"
                  self.run_apply(new_mode)
                  self.refresh_tiles()
                  self.set_status("Switched to " + MODES[new_mode]["name"].split("  ", 1)[1] + ".")

              def edit_key(self):
                  dialog = ApiKeyDialog(self)
                  dialog.exec()
                  self.refresh_tiles()

              def open_newelle(self):
                  if launch([ui.NEWELLE_SETUP, "--install"]):
                      if ui.newelle_installed():
                          self.set_status("Opening Newelle...")
                      else:
                          self.set_status("Setting up Newelle in a terminal window...")
                  else:
                      self.set_status("Could not start the Newelle setup.")

              def run_updates(self):
                  script = (
                      "echo 'Updating OneOS...'; sudo apt-get update && sudo apt-get -y full-upgrade; "
                      "if command -v flatpak >/dev/null 2>&1; then flatpak update -y; fi; "
                      "echo; echo 'All done. You can close this window.'"
                  )
                  self.open_tool(["konsole", "--hold", "-e", "bash", "-c", script])

              def open_tool(self, cmd):
                  if launch(cmd):
                      self.set_status("Opening " + cmd[0].rsplit("/", 1)[-1] + "...")
                  else:
                      self.set_status(cmd[0].rsplit("/", 1)[-1] + " is not available.")

              def install(self):
                  cmd = ["sudo", "-E", "env",
                         "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
                         "calamares"]
                  if not shutil.which("sudo") and shutil.which("install-debian"):
                      cmd = ["install-debian"]
                  if launch(cmd):
                      self.set_status("Starting the installer...")
                  else:
                      self.set_status("Could not start the installer.")

              def show_wine_guide(self):
                  QMessageBox.information(
                      self,
                      "Running Windows apps",
                      "OneOS includes 64-bit and 32-bit Wine, Winetricks and Lutris.\n\n"
                      "1. Open a terminal and run  winecfg  once to create your Wine prefix.\n"
                      "2. Right-click any .exe in Dolphin and choose Open With > Wine,\n"
                      "   or run:  wine /path/to/program.exe\n"
                      "3. Missing fonts or runtimes?  winetricks corefonts vcrun2022 dxvk\n"
                      "4. For games, open Lutris from the application menu.",
                  )


          def main():
              app = QApplication(sys.argv)
              app.setApplicationName("OneOS Welcome")
              app.setDesktopFileName("oneos-welcome")
              first_boot = not ui.FIRST_BOOT_FLAG.exists()
              if "--autostart" in sys.argv and not first_boot and not ui.startup_enabled():
                  return 0
              window = Welcome(first_boot)
              window.show()
              return app.exec()


          if __name__ == "__main__":
              sys.exit(main())
          WELCOME_PY_EOF

          chmod 0755 \
            config/includes.chroot/usr/local/bin/oneos-apply-visual-mode \
            config/includes.chroot/usr/local/bin/oneos-gemini-assistant.py \
            config/includes.chroot/usr/local/bin/oneos-circle-search \
            config/includes.chroot/usr/local/bin/oneos-newelle-setup \
            config/includes.chroot/usr/local/bin/oneos-welcome \
            config/includes.chroot/usr/local/lib/oneos/live-autologin.sh

          # Desktop entries -----------------------------------------------------------
          cat <<'AUTOSTART_EOF' > config/includes.chroot/etc/xdg/autostart/oneos-welcome.desktop
          [Desktop Entry]
          Type=Application
          Name=OneOS Welcome
          Comment=Set up OneOS and explore its features
          Exec=/usr/local/bin/oneos-welcome --autostart
          Icon=help-about
          Terminal=false
          OnlyShowIn=KDE;
          X-KDE-autostart-after=panel
          AUTOSTART_EOF

          # Login-time retry: if Newelle is not installed yet (no network earlier, closed wizard,
          # or installed from the live ISO) it asks once and offers to set it up.
          cat <<'NEWELLE_AUTOSTART_EOF' > config/includes.chroot/etc/xdg/autostart/oneos-newelle-setup.desktop
          [Desktop Entry]
          Type=Application
          Name=OneOS Newelle Setup
          Comment=Offers to install the Newelle AI assistant after first-boot setup
          Exec=/usr/local/bin/oneos-newelle-setup --auto
          Icon=system-software-install
          Terminal=false
          OnlyShowIn=KDE;
          X-KDE-autostart-after=panel
          NEWELLE_AUTOSTART_EOF

          cat <<'WELCOME_DESKTOP_EOF' > config/includes.chroot/usr/share/applications/oneos-welcome.desktop
          [Desktop Entry]
          Type=Application
          Name=OneOS Welcome
          Comment=Set up OneOS and explore its features
          Exec=/usr/local/bin/oneos-welcome
          Icon=help-about
          Terminal=false
          Categories=System;Settings;
          WELCOME_DESKTOP_EOF

          cat <<'GEMINI_DESKTOP_EOF' > config/includes.chroot/usr/share/applications/oneos-gemini-assistant.desktop
          [Desktop Entry]
          Type=Application
          Name=OneOS Gemini Assistant
          Comment=Ask Gemini from anywhere
          Exec=/usr/local/bin/oneos-gemini-assistant.py
          Icon=help-hint
          Terminal=false
          StartupNotify=false
          Categories=Utility;
          GEMINI_DESKTOP_EOF

          cat <<'CTS_DESKTOP_EOF' > config/includes.chroot/usr/share/applications/oneos-circle-search.desktop
          [Desktop Entry]
          Type=Application
          Name=OneOS Circle to Search
          Comment=Draw around anything on screen and ask Gemini about it
          Exec=/usr/local/bin/oneos-circle-search
          Icon=draw-freehand
          Terminal=false
          StartupNotify=false
          Categories=Utility;
          CTS_DESKTOP_EOF

          # Newelle quick window: works before and after install (installs first if missing)
          cat <<'NEWELLE_MINI_DESKTOP_EOF' > config/includes.chroot/usr/share/applications/oneos-newelle-mini.desktop
          [Desktop Entry]
          Type=Application
          Name=Newelle Quick Window
          Comment=Open the Newelle AI assistant quick window (Ctrl+Alt+N)
          Exec=/usr/local/bin/oneos-newelle-setup --launch-mini
          Icon=io.github.qwersyk.Newelle
          Terminal=false
          StartupNotify=false
          Categories=Utility;
          NEWELLE_MINI_DESKTOP_EOF

          # Global shortcuts. Circle to Search uses Super+Shift+C because Spectacle owns Super+Shift+S.
          cat <<'SHORTCUTS_EOF' > config/includes.chroot/etc/xdg/kglobalshortcutsrc
          [services][oneos-gemini-assistant.desktop]
          _launch=Meta+Space,Meta+Space,OneOS Gemini Assistant

          [services][oneos-circle-search.desktop]
          _launch=Meta+Shift+C,Meta+Shift+C,OneOS Circle to Search

          [services][oneos-newelle-mini.desktop]
          _launch=Ctrl+Alt+N,Ctrl+Alt+N,Newelle Quick Window
          SHORTCUTS_EOF

          # ------------------------------------------------------------------
          # Chroot hook: SDDM theme + QML runtime, multi-arch Wine, Brave, wallpapers, services,
          # XFCE purge, build-time sanity checks, size cleanup
          # ------------------------------------------------------------------
          cat <<'HOOK_EOF' > config/hooks/normal/0500-oneos-customization.hook.chroot
          #!/usr/bin/env bash
          set -euo pipefail

          # Installed in config/hooks/normal AND config/hooks/live; run only once
          if [ -f /var/lib/oneos-hook-done ]; then
            echo "ONEOS-HOOK-RAN: already done, skipping duplicate"
            exit 0
          fi
          echo "ONEOS-HOOK-RAN: 0500-oneos-customization starting"

          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS=(-y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold")

          # Install packages one by one so a single wrong/missing name never aborts the build
          try_install() {
            local pkg
            for pkg in "$@"; do
              if apt-get install "${APT_OPTS[@]}" --no-install-recommends "${pkg}"; then
                echo "[OneOS] installed ${pkg}"
              else
                echo "[OneOS] WARNING: could not install ${pkg}"
              fi
            done
          }

          dpkg --add-architecture i386
          apt-get update

          # ---- Login screen (SDDM) -------------------------------------------------------
          # The image is built with --apt-recommends false, which drops the SDDM greeter theme
          # and the Qt6 QML modules it needs. Without them SDDM shows a blank, broken screen.
          try_install \
            sddm-theme-breeze \
            sddm-theme-debian-breeze \
            kde-config-sddm \
            qt6-wayland \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            qml6-module-qtquick-templates \
            qml6-module-qtqml \
            qml6-module-qtqml-workerscript \
            qml6-module-qt5compat-graphicaleffects \
            qml6-module-org-kde-kirigami \
            breeze-cursor-theme \
            breeze-icon-theme \
            kwin-wayland \
            xserver-xorg-video-vmware

          # Pick whichever SDDM theme actually exists
          SDDM_THEME=""
          for theme in breeze debian-breeze maldives; do
            if [ -f "/usr/share/sddm/themes/${theme}/Main.qml" ]; then
              SDDM_THEME="${theme}"
              break
            fi
          done
          echo "[OneOS] SDDM theme selected: ${SDDM_THEME:-none}"
          ls -la /usr/share/sddm/themes/ || true

          mkdir -p /etc/sddm.conf.d
          {
            echo "[General]"
            echo "DisplayServer=x11"
            echo
            echo "[Theme]"
            echo "Current=${SDDM_THEME:-breeze}"
            echo "CursorTheme=breeze_cursors"
          } > /etc/sddm.conf.d/10-oneos-kde.conf
          rm -f /etc/sddm.conf

          # ---- Windows compatibility -----------------------------------------------------
          apt-get install "${APT_OPTS[@]}" --no-install-recommends \
            wine \
            wine64 \
            wine32:i386 \
            winetricks \
            cabextract \
            unzip \
            lutris

          apt-get install "${APT_OPTS[@]}" --no-install-recommends libwine libwine:i386 || true
          apt-get install "${APT_OPTS[@]}" --no-install-recommends virtualbox-guest-x11 virtualbox-guest-utils || true
          apt-get install "${APT_OPTS[@]}" --no-install-recommends plasma-discover-backend-flatpak || true

          # kwriteconfig is required by oneos-apply-visual-mode
          if ! command -v kwriteconfig6 >/dev/null 2>&1; then
            for pkg in libkf6config-bin kf6-kconfig-bin kconfig-bin; do
              apt-get install "${APT_OPTS[@]}" --no-install-recommends "${pkg}" && break || true
            done
          fi
          command -v kwriteconfig6 >/dev/null 2>&1 || echo "[OneOS] WARNING: kwriteconfig6 is missing; visual profiles will not apply"

          # Flathub (system-wide) for the Software Center. Newelle itself is installed per-user
          # after the first-boot wizard, so it is not baked into the ISO (keeps the ISO small).
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true

          # Brave Browser
          install -m 0755 -d /usr/share/keyrings
          curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg \
            https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          chmod a+r /usr/share/keyrings/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg arch=amd64] https://brave-browser-apt-release.s3.brave.com/ stable main" \
            > /etc/apt/sources.list.d/brave-browser-release.list
          apt-get update
          apt-get install "${APT_OPTS[@]}" --no-install-recommends brave-browser

          # Wallpapers for both visual profiles (generated, no extra download)
          mkdir -p /usr/share/backgrounds/oneos
          python3 - <<'WALLPAPER_PY'
          from PIL import Image, ImageChops, ImageDraw, ImageFilter

          SMALL = (640, 360)
          FULL = (2560, 1440)


          def make(path, top, bottom, glows):
              grad = Image.linear_gradient("L").resize(SMALL)
              base = Image.composite(Image.new("RGB", SMALL, bottom), Image.new("RGB", SMALL, top), grad)
              layer = Image.new("RGB", SMALL, (0, 0, 0))
              draw = ImageDraw.Draw(layer)
              for cx, cy, radius, color in glows:
                  draw.ellipse((cx - radius, cy - radius, cx + radius, cy + radius), fill=color)
              layer = layer.filter(ImageFilter.GaussianBlur(60))
              image = ImageChops.add(base, layer).resize(FULL, Image.BICUBIC)
              image.save(path, optimize=True)


          make("/usr/share/backgrounds/oneos/oneos-obsidian.png", (10, 12, 20), (24, 30, 52),
               [(470, 70, 140, (30, 44, 96)), (120, 330, 120, (22, 30, 70))])
          make("/usr/share/backgrounds/oneos/oneos-glass.png", (22, 28, 74), (14, 40, 78),
               [(130, 90, 150, (96, 70, 200)), (520, 280, 170, (30, 150, 210)), (330, 330, 120, (120, 60, 170))])
          WALLPAPER_PY

          # Remove XFCE completely
          apt-get purge -y \
            task-xfce-desktop \
            'xfce4*' \
            'xfwm4*' \
            'thunar*' \
            'xfce4-panel*' \
            'xfce4-session*' || true

          rm -f /usr/share/xsessions/*xfce*.desktop /usr/share/wayland-sessions/*xfce*.desktop

          echo "TASKSEL_DEFAULT=kde" > /etc/default/tasksel
          echo "/usr/sbin/sddm" > /etc/X11/default-display-manager
          ln -sf /lib/systemd/system/sddm.service /etc/systemd/system/display-manager.service

          systemctl enable oneos-live-autologin.service || true
          systemctl enable zramswap.service || true

          echo "RESUME=none" > /etc/initramfs-tools/conf.d/resume
          # ---- Bootloader for the Calamares installer ------------------------------------
          # Debian's calamares-bootloader-config runs "apt-get -y install grub-pc" (BIOS) or
          # "grub-efi-amd64" (UEFI) inside the freshly copied system. If grub-pc is not already in
          # the image, BIOS installs fail with "Package 'grub-pc' has no installation candidate".
          # Pre-installing it makes that apt call a no-op. UEFI installs fetch grub-efi-amd64 from
          # the network, which works because the apt package lists are kept in the image.
          try_install grub-pc
          mkdir -p /boot/grub

          # ---- Calamares prerequisites: unsquashfs must exist and must survive autoremove -----
          try_install squashfs-tools rsync
          apt-mark manual squashfs-tools rsync calamares calamares-settings-debian grub-pc >/dev/null 2>&1 || true
          UNSQ="$(command -v unsquashfs || true)"
          if [ -z "${UNSQ}" ]; then
            echo "[OneOS] ERROR: unsquashfs is missing from the image; the installer would fail"
            exit 1
          fi
          ln -sf "${UNSQ}" /usr/local/bin/unsquashfs
          echo "[OneOS] unsquashfs OK at ${UNSQ}"

          update-initramfs -u -k all || true

          # ---- Build-time sanity checks: fail the build instead of shipping a broken login screen
          echo "[OneOS] Verifying the login stack..."
          FAIL=0
          if ! ls /usr/lib/x86_64-linux-gnu/qt6/qml/QtQuick/Controls >/dev/null 2>&1; then
            echo "[OneOS] ERROR: Qt6 QtQuick.Controls QML module is missing (SDDM cannot draw its greeter)"
            FAIL=1
          fi
          if [ -z "${SDDM_THEME}" ]; then
            echo "[OneOS] ERROR: no SDDM theme was installed"
            FAIL=1
          fi
          if [ ! -x /usr/sbin/sddm ] || [ ! -x /usr/libexec/sddm-helper ] && [ ! -x /usr/lib/x86_64-linux-gnu/sddm/sddm-helper ]; then
            echo "[OneOS] WARNING: sddm helper binary not found at the usual paths"
          fi
          if ! ls /usr/share/xsessions/plasma*.desktop /usr/share/wayland-sessions/plasma*.desktop >/dev/null 2>&1; then
            echo "[OneOS] ERROR: no Plasma session files were installed"
            FAIL=1
          fi
          ls /usr/share/xsessions/ /usr/share/wayland-sessions/ 2>/dev/null || true
          for pkg in grub-pc grub-common grub-pc-bin squashfs-tools; do
            if ! dpkg -s "${pkg}" 2>/dev/null | grep -q "^Status: install ok installed"; then
              echo "[OneOS] ERROR: ${pkg} is not installed; the installer would fail"
              FAIL=1
            fi
          done
          [ -f /etc/default/grub ] || { echo "[OneOS] ERROR: /etc/default/grub is missing"; FAIL=1; }
          if [ "${FAIL}" -ne 0 ]; then
            echo "[OneOS] Login stack verification failed."
            exit 1
          fi

          touch /var/lib/oneos-hook-done
          apt-get autoremove -y --purge || true
          apt-get clean
          rm -rf /usr/share/doc/* /usr/share/man/* /tmp/*
          HOOK_EOF

          cp config/hooks/normal/0500-oneos-customization.hook.chroot \
             config/hooks/live/0500-oneos-customization.hook.chroot
          chmod 0755 config/hooks/normal/0500-oneos-customization.hook.chroot \
                     config/hooks/live/0500-oneos-customization.hook.chroot

          echo "[OneOS] Running lb build..."
          lb build 2>&1 | tee /workspace/lb-build.log

          grep -q "ONEOS-HOOK-RAN" /workspace/lb-build.log \
            || { echo "[OneOS] ERROR: customization hook never ran; refusing to ship a stock ISO" >&2; exit 1; }

          ISO_FILE="$(find "${WORKDIR}" -maxdepth 1 -type f -name '*.iso' | head -n 1)"
          if [ -z "${ISO_FILE}" ]; then
            echo "[OneOS] ERROR: Live ISO image was not generated!" >&2
            exit 1
          fi

          mv -f "${ISO_FILE}" "/workspace/OneOS-v${ONEOS_VERSION}.iso"
          ls -lh "/workspace/OneOS-v${ONEOS_VERSION}.iso"
          echo "[OneOS] Successfully compiled /workspace/OneOS-v${ONEOS_VERSION}.iso"
          BUILD_SCRIPT_EOF

          chmod +x "${GITHUB_WORKSPACE}/build-oneos.sh"

      - name: Compile OneOS ISO in Privileged Debian Trixie Container
        run: |
          docker run --rm --privileged \
            -e ONEOS_VERSION \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/var/cache/apt/archives:/var/cache/apt/archives" \
            -w /workspace \
            debian:trixie \
            /bin/bash /workspace/build-oneos.sh

      - name: Audit finished ISO for Calamares installer prerequisites
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends squashfs-tools xorriso >/dev/null
          ISO="${GITHUB_WORKSPACE}/OneOS-v${ONEOS_VERSION}.iso"
          mkdir -p /tmp/audit
          xorriso -osirrox on -indev "${ISO}" -extract /live/filesystem.squashfs /tmp/audit/fs.squashfs >/dev/null 2>&1
          test -s /tmp/audit/fs.squashfs || { echo "ERROR: live/filesystem.squashfs missing from the ISO"; exit 1; }
          ls -lh /tmp/audit/fs.squashfs
          unsquashfs -ll /tmp/audit/fs.squashfs > /tmp/audit/list.txt
          FAIL=0
          for f in usr/bin/unsquashfs usr/bin/rsync usr/sbin/grub-install usr/bin/calamares \
                   etc/calamares/modules/unpackfs.conf etc/calamares/settings.conf \
                   etc/oneos-release usr/local/lib/oneos/live-autologin.sh \
                   etc/systemd/system/oneos-live-autologin.service \
                   etc/default/grub usr/sbin/grub-mkconfig; do
            if grep -qE " squashfs-root/${f}( ->.*)?$" /tmp/audit/list.txt; then
              echo "OK       ${f}"
            else
              echo "MISSING  ${f}"; FAIL=1
            fi
          done
          if grep -qE " squashfs-root/var/lib/apt/lists/.*_Packages" /tmp/audit/list.txt; then
            echo "OK       apt package lists present (Calamares can install grub-pc / grub-efi-amd64)"
          else
            echo "MISSING  apt package lists in /var/lib/apt/lists"; FAIL=1
          fi
          grep -qE " squashfs-root/boot/grub( |$)" /tmp/audit/list.txt && echo "OK       boot/grub" || { echo "MISSING  boot/grub"; FAIL=1; }
          echo "---- /etc/calamares/modules/unpackfs.conf inside the image ----"
          unsquashfs -cat /tmp/audit/fs.squashfs etc/calamares/modules/unpackfs.conf 2>&1 | head -30
          echo "---- squashfs-tools / calamares versions inside the image ----"
          unsquashfs -cat /tmp/audit/fs.squashfs var/lib/dpkg/status 2>/dev/null \
            | awk '/^Package: (squashfs-tools|calamares|calamares-settings-debian|rsync|grub-pc)$/{p=1} p&&/^(Package|Status|Version):/{print} /^$/{p=0}'
          if [ "${FAIL}" -ne 0 ]; then
            echo "ERROR: the ISO is missing files the installer needs; not publishing it"
            exit 1
          fi
          echo "Installer prerequisites are present in the ISO."

      - name: Boot-test the ISO in QEMU (diagnostics, never blocks the release)
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 socat imagemagick >/dev/null
          ISO="${GITHUB_WORKSPACE}/OneOS-v${ONEOS_VERSION}.iso"
          mkdir -p "${GITHUB_WORKSPACE}/boot-test"
          OUT="${GITHUB_WORKSPACE}/boot-test"
          ACCEL=tcg; CPU=max
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ACCEL=kvm; CPU=host; fi
          echo "QEMU accel: ${ACCEL}" | tee "${OUT}/info.txt"
          qemu-system-x86_64 -machine accel=${ACCEL} -cpu ${CPU} -m 4096 -smp 2 \
            -cdrom "${ISO}" -boot d -vga std -display none \
            -monitor unix:/tmp/qemu-mon.sock,server,nowait &
          QPID=$!
          sleep 25
          echo "sendkey ret" | socat - UNIX-CONNECT:/tmp/qemu-mon.sock
          for t in 90 180 300 420 540; do
            sleep $((t - $(cat /tmp/last 2>/dev/null || echo 0)))
            echo "${t}" > /tmp/last
            echo "screendump ${OUT}/t${t}.ppm" | socat - UNIX-CONNECT:/tmp/qemu-mon.sock
          done
          kill "${QPID}" 2>/dev/null
          for f in "${OUT}"/*.ppm; do
            convert "$f" "${f%.ppm}.png" && rm -f "$f"
          done
          ls -l "${OUT}"

      - name: Upload Boot-Test Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneos-boot-test
          path: boot-test/
          if-no-files-found: ignore

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneos-build-log
          path: lb-build.log
          if-no-files-found: ignore

      - name: Checksum ISO and Split Only If Over GitHub 2GB Limit
        run: |
          cd "${GITHUB_WORKSPACE}"
          ISO="OneOS-v${ONEOS_VERSION}.iso"
          test -f "${ISO}"
          sha256sum "${ISO}" > "${ISO}.sha256"
          ISO_BYTES=$(stat -c%s "${ISO}")
          if [ "${ISO_BYTES}" -ge 2097152000 ]; then
            echo "ISO is ${ISO_BYTES} bytes (>= 2GB); splitting into 1900MB parts for GitHub Releases..."
            split -b 1900M -d "${ISO}" "${ISO}.part"
            rm -f "${ISO}"
          fi
          ls -lh "${ISO}"*

      - name: Publish OneOS ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.ONEOS_VERSION }}
          name: OneOS v${{ env.ONEOS_VERSION }} (Debian 13 Trixie, KDE Plasma)
          body: |
            ## OneOS v${{ env.ONEOS_VERSION }} (Debian 13 Trixie, amd64)

            ### What's new in the experience
            - **First-boot wizard:** a guided setup for your look, your Gemini key and your shortcuts, with a one-click **Install to disk** option in the live session.
            - **Newelle AI, installed for you:** when the wizard finishes, OneOS downloads **Newelle** from Flathub, applies sensible permissions (host command access, home folder) and Konsole as its terminal, then starts it so Newelle's own first-run setup guides you. Open the quick window any time with `Ctrl + Alt + N`. If you were offline or skipped, OneOS offers to set it up again at your next login.
            - **OneOS Welcome hub:** one window for appearance, AI, software, updates, Wine and system tools. Optional at login.
            - **OneOS Assistant (`Super + Space`):** a Spotlight-style Gemini chat with conversation history, Markdown answers, copy buttons, clipboard quick actions and friendly error messages.
            - **Circle to Search (`Super + Shift + C`):** draw freely around anything on screen, then ask Gemini about it.
            - **Two visual profiles:** ✨ Liquid Glass (KWin blur, translucent apps, aurora wallpaper) and ⚡ Sleek Obsidian (matte, zero GPU overhead), switchable live without logging out.
            - **Out-of-the-box polish:** Inter font, Papirus-Dark icons, blue accent, audio, Bluetooth, Wi-Fi, Flatpak/Flathub and Software Center.

            ### Fixed in this release
            - **Login screen:** the SDDM greeter theme and its Qt6 QML modules are now installed explicitly, the theme is auto-selected, and the build fails early if the login stack is incomplete.
            - **Live autologin:** the session file is detected at boot (X11 first, which is the most reliable choice in virtual machines) and the service is enabled directly in the image.

            ### Included
            - KDE Plasma (`sddm`, `kwin-x11`, `dolphin`, `konsole`, Kvantum) with XFCE fully removed
            - Multi-arch Wine (`amd64` + `i386`), Winetricks, Lutris, Brave Browser, Calamares installer, VM guest drivers
            - ZRAM (`zstd`), tuned `sysctl`, Baloo indexing disabled for low-end hardware

            ### Notes
            - Newelle needs an internet connection and about 4 GB of free space. In a small live session it is set up after you install OneOS to disk.
            - Newelle is granted access to your home folder and can run commands outside its sandbox. Review what it suggests before approving commands.

            ### Verify your download
            ```
            sha256sum -c OneOS-v${{ env.ONEOS_VERSION }}.iso.sha256
            ```
            If the ISO is split into `.part00`, `.part01`, ... join it first:
            ```
            cat OneOS-v${{ env.ONEOS_VERSION }}.iso.part* > OneOS-v${{ env.ONEOS_VERSION }}.iso
            ```
          files: |
            OneOS-v${{ env.ONEOS_VERSION }}.iso*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
