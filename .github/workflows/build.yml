          from PyQt6.QtGui import QColor, QFont, QIcon, QPainter, QPainterPath, QPen, QPixmap
          from PyQt6.QtWidgets import QApplication, QWidget

          ASSISTANT = "/usr/local/bin/oneos-gemini-assistant.py"
          HINT = "Draw around anything to search it     Enter = whole screen     Esc = cancel"


          def runtime_dir():
              return os.environ.get("XDG_RUNTIME_DIR") or tempfile.gettempdir()


          def notify(message):
              sys.stderr.write(message + "\n")
              if shutil.which("notify-send"):
                  subprocess.run(["notify-send", "-i", "dialog-warning", "Circle to Search", message], check=False)


          def capture_screen(app):
              if os.environ.get("XDG_SESSION_TYPE", "").lower() == "wayland" and shutil.which("spectacle"):
                  tmp = os.path.join(runtime_dir(), "oneos-cts-full.png")
