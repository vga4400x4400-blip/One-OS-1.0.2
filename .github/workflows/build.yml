          # ----------------------------------------------------------------- glass
          def _rounded_blur_region(x, y, w, h, radius):
              """Rectangles (x, y, w, h) that approximate a rounded rectangle, for KWin's blur region."""
              radius = max(0, min(int(radius), w // 2, h // 2))
              rects = []
              for i in range(radius):
                  dy = radius - i - 0.5
                  inset = radius - int(round(math.sqrt(max(radius * radius - dy * dy, 0.0))))
                  rects.append((x + inset, y + i, w - 2 * inset, 1))
                  rects.append((x + inset, y + h - 1 - i, w - 2 * inset, 1))
              if h - 2 * radius > 0:
                  rects.append((x, y + radius, w, h - 2 * radius))
              return rects


          def enable_blur_behind(widget, rect, radius=0):
              """Ask KWin (X11) to blur what is behind `rect` of a translucent window. Silent no-op elsewhere."""
              try:
                  from PyQt6.QtGui import QGuiApplication

                  if QGuiApplication.platformName() != "xcb" or not shutil.which("xprop"):
                      return False
                  ratio = widget.devicePixelRatioF()
                  x, y = int(rect.x() * ratio), int(rect.y() * ratio)
                  w, h = int(rect.width() * ratio), int(rect.height() * ratio)
                  values = []
                  for rx, ry, rw, rh in _rounded_blur_region(x, y, w, h, int(radius * ratio)):
                      values.extend([rx, ry, rw, rh])
                  subprocess.run(
                      ["xprop", "-id", str(int(widget.winId())), "-f", "_KDE_NET_WM_BLUR_BEHIND_REGION", "32c",
                       "-set", "_KDE_NET_WM_BLUR_BEHIND_REGION", ",".join(str(v) for v in values)],
                      check=False, timeout=5, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                  )
                  return True
              except Exception:  # noqa: BLE001 - cosmetic only
                  return False


          # ----------------------------------------------------------------- Gemini
          def _headers(api_key):
              return {"x-goog-api-key": api_key, "Content-Type": "application/json"}


          def _network_message(exc):
              if isinstance(exc, requests.exceptions.ConnectionError):
                  return "No internet connection. Connect to Wi-Fi or Ethernet and try again."
              if isinstance(exc, requests.exceptions.Timeout):
                  return "Gemini took too long to respond. Please try again."
              return "Network error: " + str(exc)


          def _explain_http_error(resp):
              code = resp.status_code
              try:
                  message = resp.json().get("error", {}).get("message", "")
              except ValueError:
                  message = ""
              if code == 400 and "api key" in message.lower():
                  return "Gemini says the API key is not valid. Open OneOS Welcome and paste it again."
              if code in (401, 403):
                  return "Gemini refused this API key (permission denied). Check the key in OneOS Welcome."
              if code == 404:
                  return "That Gemini model is not available for this key. OneOS picks a working one automatically - please try again."
              if code == 429:
                  return "Gemini rate limit or free quota reached. Wait a minute and try again."
              if code >= 500:
                  return "Gemini is overloaded right now. Please try again in a minute."
              return "Gemini error " + str(code) + ((": " + message) if message else ".")


          def list_models(api_key):
              """Gemini chat models this key can call, straight from Google (handles paging)."""
              names, token = [], ""
              for _ in range(10):
                  url = API_BASE + "/models?pageSize=100" + (("&pageToken=" + token) if token else "")
                  try:
                      resp = requests.get(url, headers=_headers(api_key), timeout=20)
                  except requests.exceptions.RequestException as exc:
                      raise GeminiError(_network_message(exc))
                  if resp.status_code != 200:
                      raise GeminiError(_explain_http_error(resp), resp.status_code)
                  data = resp.json()
                  for item in data.get("models", []):
                      name = item.get("name", "").split("/")[-1]
                      methods = item.get("supportedGenerationMethods") or []
                      if name.startswith("gemini") and "generateContent" in methods and not any(w in name for w in NON_CHAT_WORDS):
                          names.append(name)
                  token = data.get("nextPageToken", "")
                  if not token:
                      break
              return names


          def pick_model(available):
              for name in MODEL_PREFERENCE:
                  if name in available:
                      return name
              flash = sorted((m for m in available if "flash" in m and "lite" not in m), reverse=True)
              if flash:
                  return flash[0]
              return sorted(available)[-1] if available else None


          def resolve_model(api_key, force=False, avoid=None):
              """The model to use: the user's own choice if it works, else the best one Google offers this key.
              The pick is remembered (GEMINI_MODEL_AUTO) and re-checked daily, or at once when a call says 'not found'."""
              by_user = explicit_model()
              env = read_env_file()
              auto = env.get("GEMINI_MODEL_AUTO", "")
              try:
                  checked = float(env.get("GEMINI_MODEL_CHECKED", "0"))
              except ValueError:
                  checked = 0.0
              fresh = (time.time() - checked) < MODEL_RECHECK_SECONDS
              if not force and not by_user and auto and fresh and auto != avoid:
                  return auto
              try:
                  available = [m for m in list_models(api_key) if m != avoid]
              except GeminiError:
                  return by_user or auto or DEFAULT_MODEL  # offline: keep whatever worked last
              if by_user and by_user in available:
                  return by_user
              pick = pick_model(available) or DEFAULT_MODEL
              env["GEMINI_MODEL_AUTO"] = pick
              env["GEMINI_MODEL_CHECKED"] = str(int(time.time()))
              try:
                  write_env_file(env)
              except OSError:
                  pass
              return pick


          def _generate(contents, api_key, model, system_prompt):
              url = API_BASE + "/models/" + model + ":generateContent"
              payload = {
                  "contents": contents,
                  "systemInstruction": {"parts": [{"text": system_prompt or SYSTEM_PROMPT}]},
              }
              try:
                  resp = requests.post(url, headers=_headers(api_key), json=payload, timeout=90)
              except requests.exceptions.RequestException as exc:
                  raise GeminiError(_network_message(exc))
              if resp.status_code != 200:
                  raise GeminiError(_explain_http_error(resp), resp.status_code)
              data = resp.json()
              candidates = data.get("candidates") or []
              if not candidates:
                  reason = (data.get("promptFeedback") or {}).get("blockReason")
                  raise GeminiError("Gemini returned no answer" + ((" (" + reason + ")") if reason else "") + ".")
              parts = (candidates[0].get("content") or {}).get("parts") or []
              text = "\n".join(p.get("text", "") for p in parts if "text" in p and not p.get("thought")).strip()
              return text or "_Gemini returned an empty response._"


          RETRYABLE = (404, 429, 500, 502, 503, 504)


          def _next_model(api_key, avoid, not_found):
              """Another model for this key (a 404 also refreshes the remembered pick), or None."""
              if not_found:
                  pick = resolve_model(api_key, force=True, avoid=next(iter(avoid)) if len(avoid) == 1 else None)
                  if pick and pick not in avoid:
                      return pick
              try:
                  available = [m for m in list_models(api_key) if m not in avoid]
              except GeminiError:
                  return None
              return pick_model(available)


          def gemini_generate(contents, api_key, model=None, system_prompt=None):
              """Ask Gemini. If the model is retired (404), over quota (429) or overloaded (5xx), retry once and then
              move on to the next-best model this key can use, so a busy model never ends the conversation."""
              chosen = model or resolve_model(api_key)
              avoid, retried, last = set(), False, None
              for _ in range(5):
                  try:
                      return _generate(contents, api_key, chosen, system_prompt)
                  except GeminiError as exc:
                      last = exc
                      if model or exc.code not in RETRYABLE:
                          raise
                      if exc.code in (500, 502, 503, 504) and not retried:
                          retried = True
                          time.sleep(1.5)
                          continue
                      avoid.add(chosen)
                      retried = False
                      nxt = _next_model(api_key, avoid, exc.code == 404)
                      if not nxt:
                          break
                      chosen = nxt
              if last is not None and last.code in (500, 502, 503, 504):
                  raise GeminiError("Gemini is overloaded right now and every model I tried was busy. Please try again in a minute.", last.code)
              raise last or GeminiError("No Gemini chat model is available for this key. Check the key in OneOS Welcome.", 404)


          def test_api_key(api_key):
              list_models(api_key)  # raises a friendly GeminiError for a bad key, no internet, and so on
              try:
                  resolve_model(api_key, force=True)  # warm the model choice so the first question is fast
              except Exception:  # noqa: BLE001
                  pass
              return True


          # ----------------------------------------------------------------- threads
          class FuncWorker(QThread):
              """Runs fn(*args) off the UI thread and emits the result (or the exception)."""

              done = pyqtSignal(object)

              def __init__(self, fn, *args):
                  super().__init__()
                  self._fn = fn
                  self._args = args

              def run(self):
                  try:
                      result = self._fn(*self._args)
                  except Exception as exc:  # noqa: BLE001
                      result = exc
                  self.done.emit(result)


          # ----------------------------------------------------------------- voice
          SAMPLE_RATE = 16000
          CHUNK_SECONDS = 0.1
          RECORD_COMMANDS = (
              ["parecord", "--raw", "--format=s16le", "--rate=16000", "--channels=1", "--latency-msec=60"],
              ["arecord", "-q", "-t", "raw", "-f", "S16_LE", "-r", "16000", "-c", "1"],
          )
          PLAY_COMMANDS = (
              ["paplay"],
              ["aplay", "-q"],
              ["ffplay", "-nodisp", "-autoexit", "-loglevel", "quiet"],
          )
          SPEAK_COMMANDS = (
              ["espeak-ng", "-s", "165", "-v", "en-us"],
              ["spd-say", "--wait"],
          )


          def pcm_rms(chunk):
              """Loudness of a block of 16-bit mono PCM (no audioop: it was removed in Python 3.13)."""
              samples = array.array("h")
              samples.frombytes(chunk[: len(chunk) // 2 * 2])
              if not samples:
                  return 0.0
              return math.sqrt(sum(s * s for s in samples) / len(samples))


          def write_wav(path, pcm, rate=SAMPLE_RATE):
              with wave.open(str(path), "wb") as handle:
                  handle.setnchannels(1)
                  handle.setsampwidth(2)
                  handle.setframerate(rate)
                  handle.writeframes(pcm)


          def tts_to_wav(text, api_key):
              """Natural-sounding speech from Gemini. Returns a WAV path; raises GeminiError when unavailable."""
              import base64

              text = markdown_to_speech(text, 1200)
              if not text:
                  raise GeminiError("Nothing to read aloud.")
              voice = read_env_file().get("GEMINI_VOICE", "") or os.environ.get("GEMINI_VOICE", "") or TTS_VOICE
              payload = {
                  "contents": [{"parts": [{"text": text}]}],
                  "generationConfig": {
                      "responseModalities": ["AUDIO"],
                      "speechConfig": {"voiceConfig": {"prebuiltVoiceConfig": {"voiceName": voice}}},
                  },
              }
              try:
                  resp = requests.post(API_BASE + "/models/" + TTS_MODEL + ":generateContent",
                                       headers=_headers(api_key), json=payload, timeout=60)
              except requests.exceptions.RequestException as exc:
                  raise GeminiError(_network_message(exc))
              if resp.status_code != 200:
                  raise GeminiError(_explain_http_error(resp), resp.status_code)
              for cand in resp.json().get("candidates") or []:
                  for part in (cand.get("content") or {}).get("parts") or []:
                      blob = part.get("inlineData") or part.get("inline_data")
                      if blob and blob.get("data"):
                          match = re.search(r"rate=(\d+)", blob.get("mimeType") or blob.get("mime_type") or "")
                          rate = int(match.group(1)) if match else 24000
                          fd, path = tempfile.mkstemp(prefix="oneos-tts-", suffix=".wav", dir=os.environ.get("XDG_RUNTIME_DIR") or None)
                          os.close(fd)
                          write_wav(path, base64.b64decode(blob["data"]), rate)
                          return path
              raise GeminiError("Gemini returned no audio.")


          def record_command():
              for cmd in RECORD_COMMANDS:
                  if shutil.which(cmd[0]):
                      return cmd
              return None


          def speak_command():
              for cmd in SPEAK_COMMANDS:
                  if shutil.which(cmd[0]):
                      return cmd
              return None


          def play_command():
              for cmd in PLAY_COMMANDS:
                  if shutil.which(cmd[0]):
                      return cmd
              return None


          def markdown_to_speech(text, limit=1400):
              """Plain sentences for a text-to-speech engine: no code, links, bullets or emphasis marks."""
              text = re.sub(r"```.*?```", " (a code example is shown on screen) ", text, flags=re.S)
              text = re.sub(r"`([^`]*)`", r"\1", text)
              text = re.sub(r"!?\[([^\]]*)\]\([^)]*\)", r"\1", text)
              text = re.sub(r"^\s{0,3}#{1,6}\s*", "", text, flags=re.M)
              text = re.sub(r"^\s*[-*+]\s+", "", text, flags=re.M)
              text = re.sub(r"[*_~>|]", "", text)
              text = re.sub(r"\s+", " ", text).strip()
              return text[:limit]


          class SpeechGate:
              """Decides when a spoken sentence starts and ends, from 100 ms blocks of PCM. Pure logic, no audio I/O."""

              def __init__(self, hands_free=True, wait_seconds=8.0, silence_seconds=1.2, max_seconds=45.0):
                  self.hands_free = hands_free
                  self.wait_seconds = wait_seconds
                  self.silence_seconds = silence_seconds
                  self.max_seconds = max_seconds
                  self.elapsed = 0.0
                  self.noise = []
                  self.threshold = 450.0
                  self.started = False
                  self.quiet = 0.0
                  self.speech_seconds = 0.0
                  self.preroll = []
                  self.pcm = bytearray()

              def feed(self, chunk):
                  """Returns True when the recording should end."""
                  level = pcm_rms(chunk)
                  self.elapsed += CHUNK_SECONDS
                  if not self.started:
                      if len(self.noise) < 4:  # first 0.4 s calibrates the room noise
                          self.noise.append(level)
                          self.threshold = max(450.0, 3.0 * (sum(self.noise) / len(self.noise)))
                          self.preroll.append(chunk)
                          return False
                      if level > self.threshold:
                          self.started = True
                          self.pcm.extend(b"".join(self.preroll[-3:]))
                          self.pcm.extend(chunk)
                          self.speech_seconds += CHUNK_SECONDS
                          return False
                      self.preroll.append(chunk)
                      self.preroll = self.preroll[-6:]
                      return self.hands_free and self.elapsed >= self.wait_seconds
                  self.pcm.extend(chunk)
                  if level > self.threshold:
                      self.quiet = 0.0
                      self.speech_seconds += CHUNK_SECONDS
                  else:
                      self.quiet += CHUNK_SECONDS
                  if self.hands_free and self.quiet >= self.silence_seconds:
                      return True
                  return self.elapsed >= self.max_seconds

              def has_speech(self):
                  return self.started and self.speech_seconds >= 0.3


          class Recorder(QThread):
              """Records the microphone until the speaker pauses (hands-free) or stop() is called."""

              level = pyqtSignal(float)
              finished_wav = pyqtSignal(str)  # path of the WAV, or "" when nothing was said

              def __init__(self, hands_free=True):
                  super().__init__()
                  self.hands_free = hands_free
                  self._stop = False
                  self._proc = None

              def stop(self):
                  self._stop = True

              def cancel(self):
                  self._stop = True
                  self._cancelled = True
                  self._kill()

              _cancelled = False

              def _kill(self):
                  proc = self._proc
                  if proc is not None and proc.poll() is None:
                      try:
                          proc.terminate()
                      except OSError:
                          pass

              def run(self):
                  cmd = record_command()
                  if cmd is None:
                      self.finished_wav.emit("")
                      return
                  gate = SpeechGate(hands_free=self.hands_free)
                  try:
                      self._proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
                      block = int(SAMPLE_RATE * 2 * CHUNK_SECONDS)
                      while not self._stop:
                          chunk = self._proc.stdout.read(block)
                          if not chunk:
                              break
                          self.level.emit(pcm_rms(chunk))
                          if gate.feed(chunk):
                              break
                  except OSError:
                      pass
                  finally:
                      self._kill()
                  if self._cancelled or not gate.has_speech():
                      self.finished_wav.emit("")
                      return
                  fd, path = tempfile.mkstemp(prefix="oneos-voice-", suffix=".wav", dir=os.environ.get("XDG_RUNTIME_DIR") or None)
                  os.close(fd)
                  write_wav(path, bytes(gate.pcm))
                  self.finished_wav.emit(path)


          class Speaker:
              """Plays speech: a Gemini voice WAV when we have one, otherwise espeak-ng (offline)."""

              def __init__(self):
                  self.proc = None
                  self.wav = None

              def play(self, wav_path):
                  self.stop()
                  cmd = play_command()
                  if cmd is None:
                      self._drop(wav_path)
                      return False
                  try:
                      self.proc = subprocess.Popen(cmd + [wav_path], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      self.wav = wav_path
                      return True
                  except OSError:
                      self._drop(wav_path)
                      return False

              @staticmethod
              def _drop(path):
                  try:
                      os.remove(path)
                  except (OSError, TypeError):
                      pass

              def say(self, text):
                  self.stop()
                  cmd = speak_command()
                  text = markdown_to_speech(text)
                  if cmd is None or not text:
                      return False
                  try:
                      self.proc = subprocess.Popen(cmd + [text], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      return True
                  except OSError:
                      return False

              def speaking(self):
                  busy = self.proc is not None and self.proc.poll() is None
                  if not busy and self.wav:
                      self._drop(self.wav)
                      self.wav = None
                  return busy

              def stop(self):
                  if self.proc is not None and self.proc.poll() is None:
                      try:
                          self.proc.terminate()
                      except OSError:
                          pass
                  self.proc = None
                  if self.wav:
                      self._drop(self.wav)
                      self.wav = None
