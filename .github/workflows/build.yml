          def stylesheet(glass):
              card = "rgba(18, 22, 38, 170)" if glass else "rgb(16, 19, 32)"
              border = "rgba(170, 200, 255, 60)" if glass else "rgb(54, 68, 112)"
              return STYLE.replace("@CARD_BG@", card).replace("@BORDER@", border)


          # ----------------------------------------------------------------- single instance
          def _remove_pid():
              try:
                  if PID_FILE.read_text().split(":")[0] == str(os.getpid()):
                      PID_FILE.unlink()
              except OSError:
                  pass


          def single_instance(mode):
              """Same hotkey again closes the window (toggle). A different mode replaces the open one."""
              try:
                  old_pid, old_mode = PID_FILE.read_text().strip().split(":", 1)
                  old_pid = int(old_pid)
                  os.kill(old_pid, 0)
                  cmdline = Path("/proc/%d/cmdline" % old_pid).read_bytes()
                  if b"oneos-gemini-live" in cmdline and old_pid != os.getpid():
                      os.kill(old_pid, signal.SIGTERM)
                      if old_mode == mode:
                          return True
              except (OSError, ValueError):
                  pass
              try:
                  PID_FILE.write_text("%d:%s" % (os.getpid(), mode))
                  atexit.register(_remove_pid)
              except OSError:
                  pass
              return False


          # ----------------------------------------------------------------- helpers
          def image_to_b64(pixmap_or_image):
              image = pixmap_or_image.toImage() if isinstance(pixmap_or_image, QPixmap) else pixmap_or_image
              if image.isNull():
                  return None
              if max(image.width(), image.height()) > 1500:
                  image = image.scaled(1500, 1500, Qt.AspectRatioMode.KeepAspectRatio, Qt.TransformationMode.SmoothTransformation)
              data = QByteArray()
              buffer = QBuffer(data)
              buffer.open(QIODevice.OpenModeFlag.WriteOnly)
              image.save(buffer, "JPEG", 82)
              buffer.close()
              return base64.b64encode(bytes(data.data())).decode("ascii")


          def grab_screen():
              app = QApplication.instance()
              if os.environ.get("XDG_SESSION_TYPE", "").lower() == "wayland" and shutil.which("spectacle"):
                  tmp = os.path.join(os.environ.get("XDG_RUNTIME_DIR") or tempfile.gettempdir(), "oneos-live-shot.png")
                  subprocess.run(["spectacle", "-b", "-n", "-m", "-o", tmp], check=False, timeout=20)
                  shot = QPixmap(tmp)
                  try:
                      os.remove(tmp)
                  except OSError:
                      pass
                  if not shot.isNull():
                      return shot
              return app.primaryScreen().grabWindow(0)


          def audio_to_b64(path):
              with open(path, "rb") as handle:
                  return base64.b64encode(handle.read()).decode("ascii")


          HEARD = re.compile(r"^\s*HEARD:\s*(.*?)\s*(?:\n|$)", re.I)


          def split_heard(text):
              """('what the user said', 'the answer') from a reply that starts with a HEARD: line."""
              match = HEARD.match(text)
              if not match:
                  return "", text
              return match.group(1).strip().strip('"'), text[match.end():].strip() or text


          def trim_history(history):
              """Keep recent turns only and strip old screenshots and audio so requests stay small."""
              history = history[-KEEP_MESSAGES:]
              if history and history[0]["role"] != "user":
                  history = history[1:]
              shots = 0
              for message in reversed(history):
                  if message["role"] != "user":
                      continue
                  kept = []
                  has_shot = any("inline_data" in p and p["inline_data"]["mime_type"].startswith("image/") for p in message["parts"])
                  if has_shot:
                      shots += 1
                  for part in message["parts"]:
                      blob = part.get("inline_data")
                      if blob and blob["mime_type"].startswith("image/") and shots > KEEP_SCREENSHOTS:
                          kept.append({"text": "[earlier screenshot omitted]"})
                      else:
                          kept.append(part)
                  message["parts"] = kept
              return history


