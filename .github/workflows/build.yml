name: Build OneOS v1.0.2 Live ISO

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.0.1'

permissions:
  contents: write

jobs:
  build-iso:
    name: Compile OneOS v1.0.1 (Debian 13 Trixie amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force
          df -h

      - name: Prepare APT Cache Directory
        run: |
          sudo mkdir -p /var/cache/apt/archives/partial
          sudo chmod -R 777 /var/cache/apt/archives

      - name: Cache APT Archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: oneos-trixie-apt-cache-${{ runner.os }}-v1.0.1
          restore-keys: |
            oneos-trixie-apt-cache-${{ runner.os }}-

      - name: Write Privileged Live-Build Script
        run: |
          cat <<'BUILD_SCRIPT_EOF' > "${GITHUB_WORKSPACE}/build-oneos.sh"
          #!/usr/bin/env bash
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8

          WORKDIR="/workspace/oneos-build"
          CHROOT_DIR="${WORKDIR}/chroot"

          # Keep downloaded .deb archives inside the container for GitHub Actions caching
          rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/99-keep-cache

          cleanup() {
            echo "[OneOS] Executing trap cleanup for chroot mountpoints..."
            for mountpoint in \
              "${CHROOT_DIR}/dev/pts" \
              "${CHROOT_DIR}/dev" \
              "${CHROOT_DIR}/proc" \
              "${CHROOT_DIR}/sys" \
              "${CHROOT_DIR}/run" \
              "${CHROOT_DIR}/var/cache/apt/archives"; do
              if mountpoint -q "${mountpoint}" 2>/dev/null; then
                umount -lf "${mountpoint}" 2>/dev/null || true
              fi
            done
            { grep "${CHROOT_DIR}" /proc/mounts 2>/dev/null || true; } | awk '{print $2}' | sort -r | while read -r mp; do
              if [ -n "${mp}" ]; then
                umount -lf "${mp}" 2>/dev/null || true
              fi
            done
          }
          trap cleanup EXIT INT TERM

          echo "[OneOS] Installing host build dependencies inside Debian Trixie container..."
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            syslinux-efi \
            syslinux-utils \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-ia32-bin \
            mtools \
            dosfstools \
            ca-certificates \
            curl \
            wget \
            gnupg \
            cpio \
            fdisk \
            rsync

          rm -rf "${WORKDIR}"
          mkdir -p "${WORKDIR}"
          cd "${WORKDIR}"

          echo "[OneOS] Configuring live-build for Debian 13 (trixie) amd64..."
          lb config noauto \
            --distribution trixie \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --debian-installer none \
            --binary-images iso-hybrid \
            --chroot-filesystem squashfs \
            --linux-flavours amd64 \
            --bootappend-live "boot=live components quiet splash username=oneos hostname=oneos locales=en_US.UTF-8 keyboard-layouts=us" \
            --iso-application "OneOS" \
            --iso-publisher "OneOS Project" \
            --iso-volume "OneOS_v1.0.1" \
            --apt-recommends false \
            --apt-indices false \
            --cache-packages true

          echo 'MKSQUASHFS_OPTIONS="-comp xz -Xbcj x86 -b 1M -Xdict-size 100%"' >> config/common

          mkdir -p \
            config/package-lists \
            config/apt \
            config/archives \
            config/hooks/normal \
            config/includes.chroot/etc/apt/preferences.d \
            config/includes.chroot/etc/default \
            config/includes.chroot/etc/X11 \
            config/includes.chroot/etc/initramfs-tools/conf.d \
            config/includes.chroot/etc/sysctl.d \
            config/includes.chroot/etc/xdg/autostart \
            config/includes.chroot/etc/xdg \
            config/includes.chroot/etc/sddm.conf.d \
            config/includes.chroot/usr/local/bin \
            config/includes.chroot/usr/share/applications \
            config/includes.chroot/usr/share/color-schemes \
            config/includes.chroot/usr/share/Kvantum/OneOSGlass

          # Block XFCE via APT pinning
          cat <<'APT_PREF_EOF' > config/apt/preferences
          Package: task-xfce-desktop xfce4* xfwm4* thunar* xfce4-panel* xfce4-session* libxfce4*
          Pin: release *
          Pin-Priority: -1
          APT_PREF_EOF

          cp config/apt/preferences config/includes.chroot/etc/apt/preferences.d/99-no-xfce

          # Enforce KDE tasksel default and SDDM display manager
          cat <<'TASKSEL_EOF' > config/includes.chroot/etc/default/tasksel
          TASKSEL_DEFAULT=kde
          TASKSEL_EOF

          cat <<'DM_EOF' > config/includes.chroot/etc/X11/default-display-manager
          /usr/sbin/sddm
          DM_EOF

          # Prevent initramfs boot hangs
          cat <<'RESUME_EOF' > config/includes.chroot/etc/initramfs-tools/conf.d/resume
          RESUME=none
          RESUME_EOF

          # System & Low-End Hardware Responsiveness Optimisations (ZRAM + Sysctl)
          cat <<'ZRAM_EOF' > config/includes.chroot/etc/default/zramswap
          ALGO=zstd
          PERCENT=50
          PRIORITY=100
          ZRAM_EOF

          cat <<'SYSCTL_EOF' > config/includes.chroot/etc/sysctl.d/99-oneos-performance.conf
          vm.swappiness=10
          vm.vfs_cache_pressure=50
          vm.dirty_background_ratio=5
          vm.dirty_ratio=15
          SYSCTL_EOF

          # Disable KDE Baloo background file indexing by default for smooth performance
          cat <<'BALOO_EOF' > config/includes.chroot/etc/xdg/baloofilerc
          [Basic Settings]
          Indexing-Enabled=false
          BALOO_EOF

          # Default KDE Globals: Sleek Obsidian Dark look out-of-the-box
          cat <<'KDEGLOBALS_EOF' > config/includes.chroot/etc/xdg/kdeglobals
          [General]
          ColorScheme=BreezeDark
          Name=Breeze Dark
          shadeSortColumn=true
          widgetStyle=Breeze

          [Icons]
          Theme=Papirus-Dark

          [KDE]
          AnimationDurationFactor=0.5
          LookAndFeelPackage=org.kde.breezedark.desktop
          SingleClick=false
          KDEGLOBALS_EOF

          # Configure SDDM to default to Plasma (X11) session with Breeze Dark look
          cat <<'SDDM_EOF' > config/includes.chroot/etc/sddm.conf.d/10-oneos-kde.conf
          [Autologin]
          User=oneos
          Session=plasmax11.desktop
          Relogin=false

          [Theme]
          Current=breeze
          SDDM_EOF

          # Write custom Kvantum translucent config for Liquid Glass mode
          cat <<'KV_GLASS_EOF' > config/includes.chroot/usr/share/Kvantum/OneOSGlass/OneOSGlass.kvconfig
          [%General]
          author=OneOS Project
          comment=Liquid Glass Translucent Engine for OneOS
          x11drag=all
          alt_mnemonic=true
          left_tabs=true
          attach_active_tab=true
          mirror_doc_tabs=true
          group_toolbar_buttons=false
          toolbar_item_spacing=2
          toolbar_interior_spacing=2
          spread_progressbar=true
          composite=true
          menu_shadow_depth=7
          tooltip_shadow_depth=6
          splitter_width=7
          scroll_width=10
          scroll_arrows=false
          scroll_min_extent=36
          slider_width=4
          slider_handle_width=18
          slider_handle_length=18
          center_toolbar_handle=true
          check_size=16
          textless_progressbar=false
          progressbar_thickness=6
          menubar_mouse_tracking=true
          slim_toolbars=true
          merge_menubar_with_toolbar=true
          small_icon_size=16
          large_icon_size=32
          button_icon_size=16
          toolbar_icon_size=22
          combo_as_lineedit=true
          animate_states=true
          button_contents_shift=false
          combo_menu=true
          hide_combo_checkboxes=true
          lineedit_underline=false
          spin_button_width=16
          fill_rubberband=true
          translucent_windows=true
          blurring=true
          popup_blurring=true
          vertical_spin_indicators=false
          spread_menuitems=true
          no_window_pattern=false
          opaque=kaffeine,kmplayer,subtitlecomposer,kdenlive,vlc,smplayer,smplayer2,avidemux,avidemux2_qt4,avidemux3_qt4,avidemux3_qt5,qarte,knights,virtualbox,trojita,dragon,digikam

          [GeneralColors]
          window.color=#C8121521
          base.color=#B40E111A
          alt.base.color=#B4161A28
          button.color=#DC1F263B
          light.color=#3A4970
          mid.light.color=#2C3754
          dark.color=#0B0D14
          mid.color=#191F30
          shadow.color=#000000
          highlight.color=#5882FF
          inactive.highlight.color=#3954A6
          text.color=#F2F5FF
          window.text.color=#F2F5FF
          button.text.color=#FFFFFF
          disabled.text.color=#6E7A99
          tooltip.text.color=#F2F5FF
          highlight.text.color=#FFFFFF
          link.color=#7096FF
          link.visited.color=#9B82FF
          progress.indicator.text.color=#FFFFFF
          KV_GLASS_EOF

          # Write Theme & Performance Switcher Helper (/usr/local/bin/oneos-apply-visual-mode)
          cat <<'VISUAL_SH_EOF' > config/includes.chroot/usr/local/bin/oneos-apply-visual-mode
          #!/usr/bin/env bash
          set -euo pipefail

          MODE="${1:-obsidian}"
          CONF_DIR="${HOME}/.config/oneos"
          mkdir -p "${CONF_DIR}" "${HOME}/.config/Kvantum"

          # Resolve Plasma 6 or Plasma 5 config writer and dbus tool
          KWRITE="kwriteconfig6"
          if ! command -v kwriteconfig6 >/dev/null 2>&1; then
            KWRITE="kwriteconfig5"
          fi

          QDBUS_BIN="qdbus6"
          if ! command -v qdbus6 >/dev/null 2>&1; then
            if command -v qdbus >/dev/null 2>&1; then
              QDBUS_BIN="qdbus"
            elif [ -x /usr/lib/qt6/bin/qdbus ]; then
              QDBUS_BIN="/usr/lib/qt6/bin/qdbus"
            elif [ -x /usr/lib/qt5/bin/qdbus ]; then
              QDBUS_BIN="/usr/lib/qt5/bin/qdbus"
            fi
          fi

          if [ "${MODE}" = "glass" ]; then
            echo "glass" > "${CONF_DIR}/visual_mode"

            # Enable Kvantum Liquid Glass Theme
            cat <<EOF > "${HOME}/.config/Kvantum/kvantum.kvconfig"
          [General]
          theme=OneOSGlass
          EOF

            "${KWRITE}" --file kdeglobals --group General --key widgetStyle "kvantum-dark"
            "${KWRITE}" --file kdeglobals --group General --key ColorScheme "BreezeDark"
            "${KWRITE}" --file kdeglobals --group Icons --key Theme "Papirus-Dark"
            "${KWRITE}" --file kdeglobals --group KDE --key AnimationDurationFactor "0.75"

            # Enable KWin Blur, Background Contrast & Smooth Compositing
            "${KWRITE}" --file kwinrc --group Compositing --key Backend "OpenGL"
            "${KWRITE}" --file kwinrc --group Compositing --key GLCore "true"
            "${KWRITE}" --file kwinrc --group Compositing --key LatencyPolicy "Medium"
            "${KWRITE}" --file kwinrc --group Plugins --key blurEnabled "true"
            "${KWRITE}" --file kwinrc --group Plugins --key contrastEnabled "true"
            "${KWRITE}" --file kwinrc --group Plugins --key translucencyEnabled "true"
            "${KWRITE}" --file kwinrc --group Effect-blur --key BlurStrength "11"
            "${KWRITE}" --file kwinrc --group Effect-blur --key NoiseStrength "2"

            # Apply translucent window rule (92% active / 86% inactive opacity) for File Manager, Terminal & Settings
            "${KWRITE}" --file kwinrulesrc --group General --key count "1"
            "${KWRITE}" --file kwinrulesrc --group General --key rules "1"
            "${KWRITE}" --file kwinrulesrc --group 1 --key Description "OneOS Liquid Glass Translucent Apps"
            "${KWRITE}" --file kwinrulesrc --group 1 --key wmclass "dolphin|konsole|systemsettings"
            "${KWRITE}" --file kwinrulesrc --group 1 --key wmclasscomplete "false"
            "${KWRITE}" --file kwinrulesrc --group 1 --key wmclassmatch "3"
            "${KWRITE}" --file kwinrulesrc --group 1 --key opacityactive "92"
            "${KWRITE}" --file kwinrulesrc --group 1 --key opacityactiverule "2"
            "${KWRITE}" --file kwinrulesrc --group 1 --key opacityinactive "86"
            "${KWRITE}" --file kwinrulesrc --group 1 --key opacityinactiverule "2"
          else
            echo "obsidian" > "${CONF_DIR}/visual_mode"

            # Sleek Obsidian Matte Dark Mode: Native Breeze Dark C++ style + Papirus-Dark + Zero GPU Blur overhead
            "${KWRITE}" --file kdeglobals --group General --key widgetStyle "Breeze"
            "${KWRITE}" --file kdeglobals --group General --key ColorScheme "BreezeDark"
            "${KWRITE}" --file kdeglobals --group Icons --key Theme "Papirus-Dark"
            "${KWRITE}" --file kdeglobals --group KDE --key AnimationDurationFactor "0.25"

            # Disable heavy shaders for maximum responsiveness while keeping crisp Tear-Free rendering
            "${KWRITE}" --file kwinrc --group Compositing --key LatencyPolicy "Low"
            "${KWRITE}" --file kwinrc --group Plugins --key blurEnabled "false"
            "${KWRITE}" --file kwinrc --group Plugins --key contrastEnabled "false"
            "${KWRITE}" --file kwinrc --group Plugins --key translucencyEnabled "false"
            "${KWRITE}" --file kwinrc --group Plugins --key wobblywindowsEnabled "false"

            # Remove translucent window rules so all windows render solid 100% matte obsidian
            "${KWRITE}" --file kwinrulesrc --group General --key count "0"
            "${KWRITE}" --file kwinrulesrc --group General --key rules ""
          fi

          # Apply Breeze Dark global look if plasma-apply-colorscheme is available
          if command -v plasma-apply-colorscheme >/dev/null 2>&1; then
            plasma-apply-colorscheme BreezeDark >/dev/null 2>&1 || true
          fi

          # Reconfigure KWin live without requiring logout
          "${QDBUS_BIN}" org.kde.KWin /KWin reconfigure >/dev/null 2>&1 || true
          VISUAL_SH_EOF

          # Verified Package List for Debian 13 (Trixie) (amd64 base packages only; i386 Wine installed in hook)
          cat <<'PKG_LIST_EOF' > config/package-lists/custom.list.chroot
          live-boot
          live-config
          live-config-systemd
          systemd-sysv
          sudo
          locales
          ca-certificates
          gnupg
          dbus-x11
          xorg
          xserver-xorg
          x11-xserver-utils
          xdg-utils
          task-kde-desktop
          kde-standard
          plasma-desktop
          plasma-workspace
          kwin-x11
          sddm
          konsole
          dolphin
          qt5-style-kvantum
          qt6-style-kvantum
          kde-cli-tools
          kde-config-gtk-style
          breeze-gtk-theme
          papirus-icon-theme
          fonts-inter
          fonts-noto-color-emoji
          zram-tools
          calamares
          calamares-settings-debian
          vlc
          git
          curl
          wget
          fastfetch
          htop
          flatpak
          firmware-misc-nonfree
          intel-microcode
          amd64-microcode
          linux-image-amd64
          network-manager
          network-manager-gnome
          open-vm-tools
          open-vm-tools-desktop
          python3
          python3-pyqt6
          python3-requests
          python3-pil
          maim
          slop
          PKG_LIST_EOF

          # Write System-Wide Gemini Assistant (/usr/local/bin/oneos-gemini-assistant.py)
          cat <<'GEMINI_PY_EOF' > config/includes.chroot/usr/local/bin/oneos-gemini-assistant.py
          #!/usr/bin/env python3
          import argparse
          import base64
          import json
          import mimetypes
          import os
          import subprocess
          import sys
          from pathlib import Path
          import requests
          from PyQt6.QtCore import Qt, QThread, pyqtSignal, QPoint
          from PyQt6.QtGui import QColor, QFont, QPixmap, QKeySequence, QShortcut
          from PyQt6.QtWidgets import (
              QApplication,
              QFrame,
              QHBoxLayout,
              QLabel,
              QLineEdit,
              QPushButton,
              QTextEdit,
              QVBoxLayout,
              QWidget,
              QGraphicsDropShadowEffect,
          )

          CONFIG_ENV_PATH = Path.home() / ".config" / "oneos" / "gemini.env"
          VISUAL_MODE_PATH = Path.home() / ".config" / "oneos" / "visual_mode"


          def load_api_key() -> str:
              api_key = os.environ.get("GEMINI_API_KEY", "").strip()
              if api_key:
                  return api_key
              if CONFIG_ENV_PATH.exists():
                  for line in CONFIG_ENV_PATH.read_text(encoding="utf-8").splitlines():
                      if line.startswith("GEMINI_API_KEY="):
                          return line.split("=", 1)[1].strip().strip('"').strip("'")
              return ""


          def is_liquid_glass_active() -> bool:
              if VISUAL_MODE_PATH.exists():
                  return VISUAL_MODE_PATH.read_text(encoding="utf-8").strip() == "glass"
              return False


          class GeminiWorker(QThread):
              finished_signal = pyqtSignal(str)

              def __init__(self, prompt: str, image_path: str | None = None):
                  super().__init__()
                  self.prompt = prompt
                  self.image_path = image_path

              def run(self):
                  if self.prompt.startswith("/cmd ") or self.prompt.startswith("!"):
                      cmd = self.prompt[5:].strip() if self.prompt.startswith("/cmd ") else self.prompt[1:].strip()
                      if not cmd:
                          self.finished_signal.emit("Please specify a command to execute.")
                          return
                      try:
                          completed = subprocess.run(
                              cmd,
                              shell=True,
                              capture_output=True,
                              text=True,
                              timeout=30,
                          )
                          output = (completed.stdout or "") + (completed.stderr or "")
                          self.finished_signal.emit(
                              f"$ {cmd}\n\n{output.strip() or '[Command completed with exit code ' + str(completed.returncode) + ']'}"
                          )
                      except Exception as exc:
                          self.finished_signal.emit(f"Command execution error: {exc}")
                      return

                  api_key = load_api_key()
                  if not api_key:
                      self.finished_signal.emit(
                          "GEMINI_API_KEY is not set.\n\n"
                          "Open 'OneOS Welcome' from the application menu to paste your key,\n"
                          "or store it in ~/.config/oneos/gemini.env\n\n"
                          "Tip: Prefix input with '/cmd <command>' to execute local shell commands directly."
                      )
                      return

                  parts = []
                  if self.image_path and os.path.isfile(self.image_path):
                      try:
                          mime_type, _ = mimetypes.guess_type(self.image_path)
                          mime_type = mime_type or "image/png"
                          with open(self.image_path, "rb") as img_f:
                              b64_data = base64.b64encode(img_f.read()).decode("utf-8")
                          parts.append(
                              {
                                  "inline_data": {
                                      "mime_type": mime_type,
                                      "data": b64_data,
                                  }
                              }
                          )
                      except Exception as exc:
                          self.finished_signal.emit(f"Failed to read attached image: {exc}")
                          return

                  user_text = self.prompt.strip() or "Analyze this screen region and explain what is shown."
                  parts.append({"text": user_text})

                  url = (
                      "https://generativelanguage.googleapis.com/v1beta/models/"
                      f"gemini-2.5-flash:generateContent?key={api_key}"
                  )
                  payload = {"contents": [{"parts": parts}]}

                  try:
                      resp = requests.post(url, json=payload, timeout=45)
                      resp.raise_for_status()
                      data = resp.json()
                      candidates = data.get("candidates", [])
                      if not candidates:
                          self.finished_signal.emit(f"No response returned: {json.dumps(data)}")
                          return
                      text_segments = [
                          p.get("text", "")
                          for p in candidates[0].get("content", {}).get("parts", [])
                          if "text" in p
                      ]
                      self.finished_signal.emit("\n".join(text_segments).strip() or "Empty response from Gemini.")
                  except Exception as exc:
                      self.finished_signal.emit(f"Gemini API request failed: {exc}")


          class GeminiAssistantOverlay(QWidget):
              def __init__(self, image_path: str | None = None):
                  super().__init__()
                  self.image_path = image_path
                  self.drag_pos: QPoint | None = None
                  self.worker: GeminiWorker | None = None
                  self._init_ui()

              def _init_ui(self):
                  self.setWindowTitle("OneOS Gemini Assistant")
                  self.setWindowFlags(
                      Qt.WindowType.FramelessWindowHint
                      | Qt.WindowType.WindowStaysOnTopHint
                      | Qt.WindowType.Tool
                  )
                  self.setAttribute(Qt.WidgetAttribute.WA_TranslucentBackground, True)
                  self.setFixedSize(560, 420)

                  screen = QApplication.primaryScreen().availableGeometry()
                  self.move(screen.width() - self.width() - 28, 48)

                  outer_layout = QVBoxLayout(self)
                  outer_layout.setContentsMargins(14, 14, 14, 14)

                  glass = is_liquid_glass_active()
                  card_bg = "rgba(18, 21, 33, 195)" if glass else "rgba(18, 21, 32, 252)"
                  border_col = "rgba(130, 175, 255, 130)" if glass else "rgba(75, 105, 180, 220)"

                  self.card = QFrame(self)
                  self.card.setObjectName("SiriCard")
                  self.card.setStyleSheet(
                      f"QFrame#SiriCard {{"
                      f" background-color: {card_bg};"
                      f" border: 1px solid {border_col};"
                      f" border-radius: 18px;"
                      f" }}"
                      " QLabel { color: #F3F6FF; }"
                      " QLineEdit {"
                      " background-color: rgba(255, 255, 255, 20);"
                      " color: #FFFFFF;"
                      " border: 1px solid rgba(255, 255, 255, 42);"
                      " border-radius: 10px;"
                      " padding: 8px 12px;"
                      " font-size: 13px;"
                      " }"
                      " QTextEdit {"
                      " background-color: rgba(10, 12, 20, 190);"
                      " color: #E5ECFF;"
                      " border: 1px solid rgba(255, 255, 255, 28);"
                      " border-radius: 10px;"
                      " padding: 8px;"
                      " font-size: 13px;"
                      " }"
                      " QPushButton {"
                      " background-color: rgba(88, 130, 255, 215);"
                      " color: #FFFFFF;"
                      " border: none;"
                      " border-radius: 9px;"
                      " padding: 7px 13px;"
                      " font-weight: 600;"
                      " }"
                      " QPushButton:hover {"
                      " background-color: rgba(110, 150, 255, 245);"
                      " }"
                  )

                  shadow = QGraphicsDropShadowEffect(self)
                  shadow.setBlurRadius(28)
                  shadow.setOffset(0, 8)
                  shadow.setColor(QColor(0, 0, 0, 160))
                  self.card.setGraphicsEffect(shadow)

                  card_layout = QVBoxLayout(self.card)
                  card_layout.setContentsMargins(16, 14, 16, 14)
                  card_layout.setSpacing(10)

                  header_row = QHBoxLayout()
                  title_lbl = QLabel("✦ OneOS Gemini Assistant")
                  title_lbl.setFont(QFont("Sans Serif", 12, QFont.Weight.Bold))
                  header_row.addWidget(title_lbl)
                  header_row.addStretch()

                  cts_btn = QPushButton("Circle to Search")
                  cts_btn.setToolTip("Drag-select screen region (Super+Shift+S)")
                  cts_btn.clicked.connect(self.launch_circle_to_search)
                  header_row.addWidget(cts_btn)

                  close_btn = QPushButton("✕")
                  close_btn.setFixedWidth(32)
                  close_btn.clicked.connect(self.close)
                  header_row.addWidget(close_btn)
                  card_layout.addLayout(header_row)

                  self.image_preview = QLabel()
                  self.image_preview.setAlignment(Qt.AlignmentFlag.AlignCenter)
                  self.image_preview.setVisible(False)
                  card_layout.addWidget(self.image_preview)

                  if self.image_path and os.path.isfile(self.image_path):
                      pixmap = QPixmap(self.image_path)
                      if not pixmap.isNull():
                          self.image_preview.setPixmap(
                              pixmap.scaled(
                                  500,
                                  110,
                                  Qt.AspectRatioMode.KeepAspectRatio,
                                  Qt.TransformationMode.SmoothTransformation,
                              )
                          )
                          self.image_preview.setVisible(True)

                  self.output_area = QTextEdit()
                  self.output_area.setReadOnly(True)
                  self.output_area.setPlaceholderText(
                      "Ask Gemini anything, analyze a screen capture, or run '/cmd <shell command>'..."
                  )
                  card_layout.addWidget(self.output_area, stretch=1)

                  input_row = QHBoxLayout()
                  self.prompt_input = QLineEdit()
                  self.prompt_input.setPlaceholderText("Ask Gemini or type /cmd <command>...")
                  self.prompt_input.returnPressed.connect(self.submit_prompt)
                  input_row.addWidget(self.prompt_input, stretch=1)

                  send_btn = QPushButton("Ask")
                  send_btn.clicked.connect(self.submit_prompt)
                  input_row.addWidget(send_btn)
                  card_layout.addLayout(input_row)

                  outer_layout.addWidget(self.card)

                  esc_shortcut = QShortcut(QKeySequence("Escape"), self)
                  esc_shortcut.activated.connect(self.close)

                  if self.image_path and os.path.isfile(self.image_path):
                      self.prompt_input.setText("Analyze this selected screen capture and explain its contents.")
                      self.submit_prompt()

              def submit_prompt(self):
                  prompt_text = self.prompt_input.text().strip()
                  if not prompt_text and not self.image_path:
                      return
                  self.output_area.setPlainText("Thinking...")
                  self.worker = GeminiWorker(prompt_text, self.image_path)
                  self.worker.finished_signal.connect(self.on_response_ready)
                  self.worker.start()

              def on_response_ready(self, text: str):
                  self.output_area.setPlainText(text)

              def launch_circle_to_search(self):
                  self.hide()
                  subprocess.Popen(["/usr/local/bin/oneos-circle-search"])
                  QApplication.instance().quit()

              def mousePressEvent(self, event):
                  if event.button() == Qt.MouseButton.LeftButton:
                      self.drag_pos = event.globalPosition().toPoint() - self.frameGeometry().topLeft()
                      event.accept()

              def mouseMoveEvent(self, event):
                  if event.buttons() & Qt.MouseButton.LeftButton and self.drag_pos is not None:
                      self.move(event.globalPosition().toPoint() - self.drag_pos)
                      event.accept()


          def main():
              parser = argparse.ArgumentParser(description="OneOS System-Wide Gemini Assistant")
              parser.add_argument("--image", type=str, default=None, help="Path to an image for multimodal analysis")
              args = parser.parse_args()

              app = QApplication(sys.argv)
              app.setApplicationName("OneOS Gemini Assistant")
              window = GeminiAssistantOverlay(image_path=args.image)
              window.show()
              sys.exit(app.exec())


          if __name__ == "__main__":
              main()
