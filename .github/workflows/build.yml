          def read_env_file():
              data = {}
              try:
                  for line in GEMINI_ENV.read_text(encoding="utf-8").splitlines():
                      line = line.strip()
                      if not line or line.startswith("#") or "=" not in line:
                          continue
                      key, value = line.split("=", 1)
                      data[key.strip()] = value.strip().strip('"').strip("'")
              except OSError:
                  pass
              return data


          def write_env_file(data):
              CONF_DIR.mkdir(parents=True, exist_ok=True)
              body = "".join('%s="%s"\n' % (k, v) for k, v in data.items())
              fd = os.open(str(GEMINI_ENV), os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              with os.fdopen(fd, "w", encoding="utf-8") as handle:
                  handle.write(body)
              GEMINI_ENV.chmod(0o600)


