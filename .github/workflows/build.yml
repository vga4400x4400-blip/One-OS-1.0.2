              return app.primaryScreen().grabWindow(0)


          class SelectionOverlay(QWidget):
              def __init__(self, shot, geometry):
                  super().__init__()
                  self.shot = shot
                  self.points = []
                  self.drawing = False
                  self.setWindowFlags(
                      Qt.WindowType.FramelessWindowHint | Qt.WindowType.WindowStaysOnTopHint | Qt.WindowType.Tool
                  )
                  self.setCursor(Qt.CursorShape.CrossCursor)
                  self.setGeometry(geometry)

              # ------------------------------------------------------------ input
              def keyPressEvent(self, event):
                  if event.key() == Qt.Key.Key_Escape:
                      QApplication.quit()
                  elif event.key() in (Qt.Key.Key_Return, Qt.Key.Key_Enter):
                      self.finish(QRectF(self.rect()))

              def mousePressEvent(self, event):
                  if event.button() == Qt.MouseButton.LeftButton:
                      self.drawing = True
                      self.points = [event.position()]
                      self.update()
                  elif event.button() == Qt.MouseButton.RightButton:
                      QApplication.quit()

              def mouseMoveEvent(self, event):
                  if self.drawing:
                      last = self.points[-1]
                      pos = event.position()
                      if abs(pos.x() - last.x()) + abs(pos.y() - last.y()) >= 2:
                          self.points.append(pos)
                          self.update()

              def mouseReleaseEvent(self, event):
                  if event.button() != Qt.MouseButton.LeftButton or not self.drawing:
                      return
                  self.drawing = False
                  rect = self.selection_rect()
                  if rect is None or rect.width() < 24 or rect.height() < 24:
                      self.points = []
                      self.update()
                      return
                  self.finish(rect)

              # ------------------------------------------------------------ geometry
              def path(self):
                  path = QPainterPath()
                  if self.points:
                      path.moveTo(self.points[0])
                      for point in self.points[1:]:
                          path.lineTo(point)
                  return path

              def selection_rect(self):
                  if len(self.points) < 2:
                      return None
                  rect = self.path().boundingRect().adjusted(-10, -10, 10, 10)
                  return rect.intersected(QRectF(self.rect()))

              def finish(self, rect):
                  ratio_x = self.shot.width() / max(1, self.width())
                  ratio_y = self.shot.height() / max(1, self.height())
                  crop = QRect(
                      int(rect.x() * ratio_x),
                      int(rect.y() * ratio_y),
                      int(rect.width() * ratio_x),
                      int(rect.height() * ratio_y),
                  )
                  out = os.path.join(runtime_dir(), "oneos-circle-search.png")
                  if not self.shot.copy(crop).save(out, "PNG"):
                      notify("Could not save the selected region.")
                      QApplication.quit()
                      return
                  self.hide()
                  subprocess.Popen([ASSISTANT, "--image", out], start_new_session=True)
                  QApplication.quit()

              # ------------------------------------------------------------ painting
              def paintEvent(self, _event):
                  painter = QPainter(self)
                  painter.setRenderHint(QPainter.RenderHint.Antialiasing)
                  painter.drawPixmap(self.rect(), self.shot)
                  painter.fillRect(self.rect(), QColor(8, 10, 22, 150))

                  rect = self.selection_rect()
                  if rect is not None:
                      painter.save()
                      painter.setClipRect(rect)
                      painter.drawPixmap(self.rect(), self.shot)
                      painter.restore()
                      path = self.path()
                      for width, alpha, color in ((16, 28, (110, 150, 255)), (8, 70, (130, 170, 255)), (3, 255, (255, 255, 255))):
                          pen = QPen(QColor(color[0], color[1], color[2], alpha), width)
                          pen.setCapStyle(Qt.PenCapStyle.RoundCap)
                          pen.setJoinStyle(Qt.PenJoinStyle.RoundJoin)
                          painter.setPen(pen)
                          painter.setBrush(Qt.BrushStyle.NoBrush)
                          painter.drawPath(path)

                  # Hint pill
                  font = QFont()
                  font.setPointSize(11)
                  font.setWeight(QFont.Weight.DemiBold)
                  painter.setFont(font)
                  metrics = painter.fontMetrics()
                  width = metrics.horizontalAdvance(HINT) + 40
                  pill = QRectF((self.width() - width) / 2, 26, width, 38)
                  painter.setPen(Qt.PenStyle.NoPen)
                  painter.setBrush(QColor(16, 19, 32, 225))
                  painter.drawRoundedRect(pill, 19, 19)
                  painter.setPen(QColor(238, 242, 255))
                  painter.drawText(pill, Qt.AlignmentFlag.AlignCenter, HINT)


          def main():
              app = QApplication(sys.argv)
              app.setApplicationName("OneOS Circle to Search")
              app.setWindowIcon(QIcon.fromTheme("oneos-circle-search"))
              shot = capture_screen(app)
              if shot.isNull():
                  notify("Could not capture the screen. On Wayland, install or allow Spectacle.")
                  return 1
              overlay = SelectionOverlay(shot, app.primaryScreen().geometry())
              overlay.showFullScreen()
              overlay.activateWindow()
              overlay.setFocus()
              return app.exec()


          if __name__ == "__main__":
              sys.exit(main())
