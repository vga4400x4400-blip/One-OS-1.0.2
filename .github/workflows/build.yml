          # ------------------------------------------------------------------
          # Circle to Search: freehand "draw around it" screen selection
          # ------------------------------------------------------------------
          cat <<'CTS_PY_EOF' > config/includes.chroot/usr/local/bin/oneos-circle-search
          #!/usr/bin/env python3
          """OneOS Circle to Search - draw around anything on screen, then ask Gemini about it."""
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          from PyQt6.QtCore import QPointF, QRect, QRectF, Qt
          from PyQt6.QtGui import QColor, QFont, QPainter, QPainterPath, QPen, QPixmap
          from PyQt6.QtWidgets import QApplication, QWidget

          ASSISTANT = "/usr/local/bin/oneos-gemini-assistant.py"
          HINT = "Draw around anything to search it     Enter = whole screen     Esc = cancel"


          def runtime_dir():
              return os.environ.get("XDG_RUNTIME_DIR") or tempfile.gettempdir()


          def notify(message):
              sys.stderr.write(message + "\n")
              if shutil.which("notify-send"):
                  subprocess.run(["notify-send", "-i", "dialog-warning", "Circle to Search", message], check=False)


          def capture_screen(app):
              if os.environ.get("XDG_SESSION_TYPE", "").lower() == "wayland" and shutil.which("spectacle"):
                  tmp = os.path.join(runtime_dir(), "oneos-cts-full.png")
                  subprocess.run(["spectacle", "-b", "-n", "-m", "-o", tmp], check=False, timeout=20)
                  pixmap = QPixmap(tmp)
                  try:
                      os.remove(tmp)
                  except OSError:
                      pass
                  if not pixmap.isNull():
                      return pixmap
              return app.primaryScreen().grabWindow(0)


          class SelectionOverlay(QWidget):
              def __init__(self, shot, geometry):
                  super().__init__()
                  self.shot = shot
                  self.points = []
                  self.drawing = False
                  self.setWindowFlags(
                      Qt.WindowType.FramelessWindowHint | Qt.WindowType.WindowStaysOnTopHint | Qt.WindowType.Tool
                  )
                  self.setCursor(Qt.CursorShape.CrossCursor)
                  self.setGeometry(geometry)

              # ------------------------------------------------------------ input
              def keyPressEvent(self, event):
                  if event.key() == Qt.Key.Key_Escape:
                      QApplication.quit()
                  elif event.key() in (Qt.Key.Key_Return, Qt.Key.Key_Enter):
                      self.finish(QRectF(self.rect()))

              def mousePressEvent(self, event):
                  if event.button() == Qt.MouseButton.LeftButton:
                      self.drawing = True
                      self.points = [event.position()]
                      self.update()
                  elif event.button() == Qt.MouseButton.RightButton:
                      QApplication.quit()

              def mouseMoveEvent(self, event):
                  if self.drawing:
                      last = self.points[-1]
                      pos = event.position()
                      if abs(pos.x() - last.x()) + abs(pos.y() - last.y()) >= 2:
                          self.points.append(pos)
                          self.update()

              def mouseReleaseEvent(self, event):
                  if event.button() != Qt.MouseButton.LeftButton or not self.drawing:
                      return
                  self.drawing = False
                  rect = self.selection_rect()
                  if rect is None or rect.width() < 24 or rect.height() < 24:
                      self.points = []
                      self.update()
                      return
                  self.finish(rect)

              # ------------------------------------------------------------ geometry
              def path(self):
                  path = QPainterPath()
                  if self.points:
                      path.moveTo(self.points[0])
                      for point in self.points[1:]:
                          path.lineTo(point)
                  return path

              def selection_rect(self):
                  if len(self.points) < 2:
                      return None
                  rect = self.path().boundingRect().adjusted(-10, -10, 10, 10)
                  return rect.intersected(QRectF(self.rect()))

              def finish(self, rect):
                  ratio_x = self.shot.width() / max(1, self.width())
                  ratio_y = self.shot.height() / max(1, self.height())
                  crop = QRect(
                      int(rect.x() * ratio_x),
                      int(rect.y() * ratio_y),
                      int(rect.width() * ratio_x),
                      int(rect.height() * ratio_y),
                  )
                  out = os.path.join(runtime_dir(), "oneos-circle-search.png")
                  if not self.shot.copy(crop).save(out, "PNG"):
                      notify("Could not save the selected region.")
                      QApplication.quit()
                      return
                  self.hide()
                  subprocess.Popen([ASSISTANT, "--image", out], start_new_session=True)
                  QApplication.quit()

              # ------------------------------------------------------------ painting
              def paintEvent(self, _event):
                  painter = QPainter(self)
                  painter.setRenderHint(QPainter.RenderHint.Antialiasing)
                  painter.drawPixmap(self.rect(), self.shot)
                  painter.fillRect(self.rect(), QColor(8, 10, 22, 150))

                  rect = self.selection_rect()
                  if rect is not None:
                      painter.save()
                      painter.setClipRect(rect)
                      painter.drawPixmap(self.rect(), self.shot)
                      painter.restore()
                      path = self.path()
                      for width, alpha, color in ((16, 28, (110, 150, 255)), (8, 70, (130, 170, 255)), (3, 255, (255, 255, 255))):
                          pen = QPen(QColor(color[0], color[1], color[2], alpha), width)
                          pen.setCapStyle(Qt.PenCapStyle.RoundCap)
                          pen.setJoinStyle(Qt.PenJoinStyle.RoundJoin)
                          painter.setPen(pen)
                          painter.setBrush(Qt.BrushStyle.NoBrush)
                          painter.drawPath(path)

                  # Hint pill
                  font = QFont()
                  font.setPointSize(11)
                  font.setWeight(QFont.Weight.DemiBold)
                  painter.setFont(font)
                  metrics = painter.fontMetrics()
                  width = metrics.horizontalAdvance(HINT) + 40
                  pill = QRectF((self.width() - width) / 2, 26, width, 38)
                  painter.setPen(Qt.PenStyle.NoPen)
                  painter.setBrush(QColor(16, 19, 32, 225))
                  painter.drawRoundedRect(pill, 19, 19)
                  painter.setPen(QColor(238, 242, 255))
                  painter.drawText(pill, Qt.AlignmentFlag.AlignCenter, HINT)


          def main():
              app = QApplication(sys.argv)
              app.setApplicationName("OneOS Circle to Search")
              shot = capture_screen(app)
              if shot.isNull():
                  notify("Could not capture the screen. On Wayland, install or allow Spectacle.")
                  return 1
              overlay = SelectionOverlay(shot, app.primaryScreen().geometry())
              overlay.showFullScreen()
              overlay.activateWindow()
              overlay.setFocus()
              return app.exec()


          if __name__ == "__main__":
              sys.exit(main())
          CTS_PY_EOF

          # ------------------------------------------------------------------
          # Newelle: installs the Newelle AI assistant (Flathub) after the first-boot wizard,
          # applies the permissions/terminal settings that make it useful, then starts it so
          # Newelle's own first-run setup appears.
          #   oneos-newelle-setup --install      install (if needed), configure, launch
          #   oneos-newelle-setup --auto         login-time retry: asks once, skipped in live sessions
          #   oneos-newelle-setup --launch-mini  open the Newelle quick window (installs first if missing)
          # ------------------------------------------------------------------
          cat <<'NEWELLE_SH_EOF' > config/includes.chroot/usr/local/bin/oneos-newelle-setup
          #!/usr/bin/env bash
          # OneOS: install and configure Newelle (https://github.com/qwersyk/Newelle) from Flathub.
          set -uo pipefail

          APP_ID="io.github.qwersyk.Newelle"
          REMOTE_URL="https://dl.flathub.org/repo/flathub.flatpakrepo"
          CONF_DIR="${XDG_CONFIG_HOME:-${HOME}/.config}/oneos"
          LOG_DIR="${HOME}/.cache/oneos"
          LOG_FILE="${LOG_DIR}/newelle-setup.log"
          DONE_FLAG="${CONF_DIR}/newelle_installed"
          MIN_LIVE_KB=4194304
          MODE="${1:---install}"

          mkdir -p "${CONF_DIR}" "${LOG_DIR}"

          say()  { printf '\n\033[1;36m[Newelle]\033[0m %s\n' "$*"; }
          warn() { printf '\n\033[1;33m[Newelle]\033[0m %s\n' "$*"; }

          notify() {
            if command -v notify-send >/dev/null 2>&1; then
              notify-send -i "${3:-dialog-information}" "$1" "${2:-}" || true
            fi
          }

          is_live() { grep -q 'boot=live' /proc/cmdline 2>/dev/null; }
          is_installed() { flatpak info "${APP_ID}" >/dev/null 2>&1; }
          have_network() { curl -fsS --max-time 8 -o /dev/null "${REMOTE_URL}" >/dev/null 2>&1; }
          pause_close() { printf '\nPress Enter to close this window...'; read -r _ || true; }

          # Show progress in a Konsole window when started from the desktop (no terminal attached)
          relaunch_in_terminal() {
            if [ -t 1 ] || [ "${ONEOS_IN_TERM:-0}" = "1" ]; then
              return 0
            fi
            if command -v konsole >/dev/null 2>&1; then
              ONEOS_IN_TERM=1 exec konsole --separate --hide-menubar -e "$0" "$@"
            fi
            return 0
          }

          launch_newelle() {
            nohup flatpak run "${APP_ID}" "$@" >/dev/null 2>&1 &
            disown || true
          }

          configure_newelle() {
            say "Applying OneOS settings for Newelle..."
            # Let Newelle run the commands it suggests on the real system (opt-in per command inside Newelle)
            flatpak override --user \
              --talk-name=org.freedesktop.Flatpak \
              --filesystem=home \
              "${APP_ID}" || true
            # Use Konsole for terminal commands, and Plasma-friendly defaults
            flatpak run --command=gsettings "${APP_ID}" set io.github.qwersyk.Newelle external-terminal-on true || true
            flatpak run --command=gsettings "${APP_ID}" set io.github.qwersyk.Newelle external-terminal "'konsole -e bash -c {0}'" || true
          }

          install_newelle() {
            if ! command -v flatpak >/dev/null 2>&1; then
              warn "Flatpak is not installed on this system."
              return 1
            fi

            if is_live; then
              local avail_kb
              avail_kb="$(df --output=avail -k "${HOME}" 2>/dev/null | tail -n 1 | tr -d ' ')"
              if [ "${avail_kb:-0}" -lt "${MIN_LIVE_KB}" ]; then
                warn "Not enough free space in the live session (Newelle needs about 4 GB)."
                warn "It will be set up automatically after you install OneOS to disk."
                notify "Newelle" "Not enough space in the live session. It will be set up after installing OneOS." dialog-information
                return 2
              fi
            fi

            say "Checking your internet connection..."
            local tries=0
            until have_network; do
              tries=$((tries + 1))
              if [ "${tries}" -ge 12 ]; then
                warn "No internet connection. Connect to Wi-Fi or Ethernet, then try again from OneOS Welcome."
                return 1
              fi
              sleep 5
            done

            say "Adding the Flathub app store..."
            flatpak remote-add --user --if-not-exists flathub "${REMOTE_URL}" || true

            say "Installing Newelle. This can take a few minutes..."
            local attempt
            for attempt in 1 2 3; do
              if flatpak install --user -y --noninteractive flathub "${APP_ID}"; then
                return 0
              fi
              warn "Attempt ${attempt} failed. Retrying in 5 seconds..."
              sleep 5
            done
            return 1
          }

          case "${MODE}" in
            --install)
              ;;
            --launch-mini)
              if is_installed; then
                exec flatpak run "${APP_ID}" --mini
              fi
              MODE="--install"
              ;;
            --auto)
              [ -f "${CONF_DIR}/first_boot_done" ] || exit 0
              is_installed && exit 0
              is_live && exit 0
              command -v flatpak >/dev/null 2>&1 || exit 0
              sleep 25
              if command -v kdialog >/dev/null 2>&1; then
                kdialog --title "OneOS" --dontagain "oneosrc:newelle_prompt" \
                  --yesno "Newelle, the full AI assistant app for OneOS, is not installed yet.\n\nInstall and set it up now? (needs internet)" || exit 0
              fi
              MODE="--install"
              ;;
            *)
              echo "Usage: oneos-newelle-setup [--install|--auto|--launch-mini]" >&2
              exit 2
              ;;
          esac

          relaunch_in_terminal "${MODE}"
          exec > >(tee -a "${LOG_FILE}") 2>&1

          printf '\033[1;36m'
          echo "=============================================="
          echo "   OneOS  |  Newelle AI assistant setup"
          echo "=============================================="
          printf '\033[0m'

          if is_installed; then
            say "Newelle is already installed."
          else
            install_newelle
            rc=$?
            if [ "${rc}" -eq 2 ]; then
              sleep 6
              exit 0
            fi
            if [ "${rc}" -ne 0 ]; then
              warn "Newelle could not be installed. Details: ${LOG_FILE}"
              notify "Newelle setup failed" "Check your connection and try again from OneOS Welcome." dialog-warning
              pause_close
              exit 1
            fi
            rm -f "${DONE_FLAG}"
          fi

          if [ ! -f "${DONE_FLAG}" ]; then
            configure_newelle
            date -u +%FT%TZ > "${DONE_FLAG}"
          fi

          notify "Newelle is ready" "Starting it now. Press Ctrl+Alt+N any time for the quick window." dialog-information
          say "Starting Newelle. Its own first-run setup will guide you from here."
          say "Tip: press Ctrl+Alt+N any time for the quick window."
          launch_newelle
          sleep 4
          exit 0
          NEWELLE_SH_EOF

