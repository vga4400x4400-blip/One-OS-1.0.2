          STATES = {
              "idle": ("#9AA6C8", "Ready. Tap the mic or type."),
              "listening": ("#EF4444", "Listening... just talk"),
              "thinking": ("#F59E0B", "Looking at your screen..."),
              "speaking": ("#4ADE80", "Speaking... tap the mic to interrupt"),
