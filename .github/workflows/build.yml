          #!/usr/bin/env python3
          import os
          import shutil
          import subprocess
          import sys

          CROP_OUTPUT = "/tmp/oneos_cts_crop.png"


          def main():
              if os.path.exists(CROP_OUTPUT):
                  try:
                      os.remove(CROP_OUTPUT)
                  except OSError:
                      pass

              if not shutil.which("maim") or not shutil.which("slop"):
                  sys.stderr.write("Error: maim and slop are required for Circle to Search.\n")
