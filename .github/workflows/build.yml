                  circle_btn.clicked.connect(self.launch_circle_to_search)
                  new_btn = QPushButton("\uff0b  New chat")
                  new_btn.setToolTip("Ctrl+L")
                  new_btn.clicked.connect(self.new_chat)
                  close_btn = QPushButton("\u2715")
                  close_btn.setFixedWidth(34)
                  close_btn.setToolTip("Close (Esc)")
                  close_btn.clicked.connect(self.close)
                  for btn in (circle_btn, new_btn, close_btn):
                      btn.setCursor(Qt.CursorShape.PointingHandCursor)
                      hl.addWidget(btn)
                  root.addWidget(header)

                  # Attached image row
                  self.image_row = QFrame()
                  self.image_row.setObjectName("ImageRow")
                  il = QHBoxLayout(self.image_row)
                  il.setContentsMargins(8, 6, 8, 6)
                  self.thumb = QLabel()
                  note = QLabel("Screen region attached - ask anything about it")
                  note.setObjectName("Muted")
                  remove_btn = QPushButton("Remove")
                  remove_btn.setObjectName("Ghost")
                  remove_btn.clicked.connect(self.clear_image)
                  il.addWidget(self.thumb)
                  il.addWidget(note, 1)
                  il.addWidget(remove_btn)
                  root.addWidget(self.image_row)

                  # Empty state
                  self.empty = QWidget()
                  el = QVBoxLayout(self.empty)
                  el.setAlignment(Qt.AlignmentFlag.AlignCenter)
                  el.setSpacing(10)
                  spark = QLabel("\u2726")
                  spark.setObjectName("Spark")
                  hero = QLabel("What can I help with?")
                  hero.setObjectName("Hero")
                  hint = QLabel("Ask a question, or try  /cmd uname -a  to run a shell command.")
                  hint.setObjectName("Muted")
                  self.chip_row = QHBoxLayout()
                  self.chip_row.setAlignment(Qt.AlignmentFlag.AlignCenter)
                  for widget in (spark, hero, hint):
                      widget.setAlignment(Qt.AlignmentFlag.AlignCenter)
                      el.addWidget(widget)
                  el.addSpacing(6)
                  el.addLayout(self.chip_row)
                  root.addWidget(self.empty, 1)

                  # Messages
                  self.scroll = QScrollArea()
                  self.scroll.setWidgetResizable(True)
                  self.scroll.setHorizontalScrollBarPolicy(Qt.ScrollBarPolicy.ScrollBarAlwaysOff)
                  container = QWidget()
                  self.msg_layout = QVBoxLayout(container)
                  self.msg_layout.setContentsMargins(2, 2, 6, 2)
                  self.msg_layout.setSpacing(10)
                  self.msg_layout.addStretch()
                  self.scroll.setWidget(container)
                  bar = self.scroll.verticalScrollBar()
                  bar.rangeChanged.connect(lambda _lo, hi: bar.setValue(hi))
                  root.addWidget(self.scroll, 1)
                  self.scroll.hide()

                  # Input
                  row = QHBoxLayout()
                  row.setSpacing(8)
                  self.prompt_input = QLineEdit()
                  self.prompt_input.setPlaceholderText("Ask Gemini anything...")
                  self.prompt_input.returnPressed.connect(lambda: self.send())
                  self.send_btn = QPushButton("Ask  \u21b5")
                  self.send_btn.setObjectName("Primary")
                  self.send_btn.setCursor(Qt.CursorShape.PointingHandCursor)
                  self.send_btn.clicked.connect(lambda: self.send())
                  row.addWidget(self.prompt_input, 1)
                  row.addWidget(self.send_btn)
                  root.addLayout(row)

                  footer = QLabel("Enter to send   \u00b7   Esc to close   \u00b7   Ctrl+L new chat   \u00b7   Super+Space toggles")
                  footer.setObjectName("Muted")
                  footer.setAlignment(Qt.AlignmentFlag.AlignCenter)
                  root.addWidget(footer)

                  QShortcut(QKeySequence("Escape"), self).activated.connect(self.close)
                  QShortcut(QKeySequence("Ctrl+L"), self).activated.connect(self.new_chat)

                  self.refresh_image_row()
                  self.refresh_chips()
                  self.prompt_input.setFocus()

              # ------------------------------------------------------------ image + chips
              def refresh_image_row(self):
                  if self.image_b64 and self.image_path:
                      pixmap = QPixmap(self.image_path)
                      if not pixmap.isNull():
                          self.thumb.setPixmap(
                              pixmap.scaledToHeight(44, Qt.TransformationMode.SmoothTransformation)
                          )
                      self.image_row.show()
                  else:
                      self.image_row.hide()

              def clear_image(self):
                  self.image_b64 = None
                  self.image_path = None
                  self.image_sent = False
                  self.refresh_image_row()
                  self.refresh_chips()

              def refresh_chips(self):
                  while self.chip_row.count():
                      item = self.chip_row.takeAt(0)
                      if item.widget():
                          item.widget().deleteLater()
                  if self.image_b64:
                      chips = [
                          ("Explain this", "Explain what is shown in this image."),
                          ("Extract text", "Extract all text from this image as plain text."),
                          ("Translate", "Translate any text in this image to English."),
                      ]
                  else:
                      chips = [
                          ("Summarize clipboard", "clipboard:Summarize the following text in a few bullet points:"),
                          ("Fix my writing", "clipboard:Fix grammar and spelling, keep the tone:"),
                          ("Explain clipboard", "clipboard:Explain the following clearly and simply:"),
                      ]
                  for label, prompt in chips:
                      btn = QPushButton(label)
                      btn.setObjectName("Chip")
                      btn.setCursor(Qt.CursorShape.PointingHandCursor)
                      btn.clicked.connect(lambda _checked=False, p=prompt: self.run_chip(p))
                      self.chip_row.addWidget(btn)

              def run_chip(self, prompt):
                  if prompt.startswith("clipboard:"):
                      clip = QGuiApplication.clipboard().text().strip()
                      if not clip:
                          self.show_messages()
                          self.add_bubble("Your clipboard is empty. Copy some text first, then try again.", "ai", copyable=False)
                          return
                      self.send(prompt[len("clipboard:"):] + "\n\n" + clip)
                  else:
                      self.send(prompt)

              # ------------------------------------------------------------ messages
              def show_messages(self):
                  self.empty.hide()
                  self.scroll.show()

              def add_bubble(self, text, role, copyable=True):
                  bubble = Bubble(text, role, copyable)
                  row = QWidget()
                  rl = QHBoxLayout(row)
                  rl.setContentsMargins(0, 0, 0, 0)
                  if role == "user":
                      rl.addStretch()
                      rl.addWidget(bubble)
                  else:
                      rl.addWidget(bubble)
                      rl.addStretch()
                  self.msg_layout.insertWidget(self.msg_layout.count() - 1, row)
                  return bubble, row

              def new_chat(self):
                  if self.busy:
                      return
                  self.history = []
                  self.clear_image()
                  while self.msg_layout.count() > 1:
                      item = self.msg_layout.takeAt(0)
                      if item.widget():
                          item.widget().deleteLater()
                  self.scroll.hide()
                  self.empty.show()
                  self.prompt_input.setFocus()

              def set_busy(self, busy):
                  self.busy = busy
                  self.send_btn.setEnabled(not busy)
                  self.prompt_input.setEnabled(not busy)
                  if busy:
                      self.thinking_bubble, self.thinking_row = self.add_bubble("_Thinking_", "ai", copyable=False)
                      self.dots = 0
                      self.dot_timer.start(380)
                  else:
                      self.dot_timer.stop()
                      if self.thinking_row is not None:
                          self.thinking_row.deleteLater()
                          self.thinking_row = None
                          self.thinking_bubble = None
                      self.prompt_input.setFocus()

              def _tick(self):
                  self.dots = (self.dots + 1) % 4
                  if self.thinking_bubble is not None:
                      self.thinking_bubble.set_text("_Thinking" + "." * self.dots + "_")

              # ------------------------------------------------------------ sending
              def send(self, text=None):
                  if self.busy:
                      return
                  text = (text if text is not None else self.prompt_input.text()).strip()
                  if not text and not (self.image_b64 and not self.image_sent):
                      return
                  self.prompt_input.clear()
                  self.last_text = text
                  self.show_messages()

                  if text.startswith("/cmd"):
                      cmd = text[4:].strip()
                      self.add_bubble(text, "user")
                      if not cmd:
                          self.add_bubble("Usage: `/cmd <shell command>`", "ai", copyable=False)
                          return
                      self.set_busy(True)
                      self.worker = ui.FuncWorker(run_shell, cmd)
                      self.worker.done.connect(lambda res: self.on_done(res, True))
                      self.worker.start()
                      return

                  api_key = ui.load_api_key()
                  self.add_bubble(text or "(screen region)", "user")
                  if not api_key:
                      self.add_bubble(
                          "**No Gemini API key yet.** Open **OneOS Welcome** and choose **Gemini API key**. "
                          "It takes about a minute and the key is free from Google AI Studio.",
                          "ai",
                          copyable=False,
                      )
                      btn = QPushButton("Open OneOS Welcome")
                      btn.setObjectName("Primary")
                      btn.clicked.connect(lambda: subprocess.Popen([WELCOME], start_new_session=True))
                      self.msg_layout.insertWidget(self.msg_layout.count() - 1, btn, alignment=Qt.AlignmentFlag.AlignLeft)
                      return

                  parts = []
                  if self.image_b64 and not self.image_sent:
                      parts.append({"inline_data": {"mime_type": "image/jpeg", "data": self.image_b64}})
                      self.image_sent = True
                  parts.append({"text": text or "Explain what is shown in this image."})
                  self.history.append({"role": "user", "parts": parts})

                  self.set_busy(True)
                  self.worker = ui.FuncWorker(ui.gemini_generate, list(self.history), api_key)
                  self.worker.done.connect(lambda res: self.on_done(res, False))
                  self.worker.start()

              def on_done(self, result, local):
                  self.set_busy(False)
                  if isinstance(result, Exception):
                      if not local and self.history and self.history[-1]["role"] == "user":
                          self.history.pop()
                          if not self.history:
                              self.image_sent = False
                      self.add_bubble("\u26a0\ufe0f " + str(result), "ai", copyable=False)
                      if self.last_text:
                          self.prompt_input.setText(self.last_text)
                          self.prompt_input.selectAll()
                      return
                  if not local:
                      self.history.append({"role": "model", "parts": [{"text": result}]})
                  self.add_bubble(result, "ai")

              # ------------------------------------------------------------ actions
              def launch_circle_to_search(self):
                  self.hide()
                  subprocess.Popen([CIRCLE_SEARCH], start_new_session=True)
                  QTimer.singleShot(150, QApplication.instance().quit)


          def main():
              parser = argparse.ArgumentParser(description="OneOS Assistant")
              parser.add_argument("--image", type=str, default=None, help="Image to attach (screen region)")
              args = parser.parse_args()

              if single_instance(replace=bool(args.image)):
                  return 0

              app = QApplication(sys.argv)
              app.setApplicationName("OneOS Assistant")
              app.setDesktopFileName("oneos-gemini-assistant")
              signal.signal(signal.SIGTERM, lambda *_: app.quit())
              heartbeat = QTimer()
              heartbeat.timeout.connect(lambda: None)
              heartbeat.start(400)

              window = AssistantOverlay(image_path=args.image)
              window.show()
              window.raise_()
              window.activateWindow()
              return app.exec()


          if __name__ == "__main__":
