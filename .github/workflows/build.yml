                  self.input.returnPressed.connect(self.send_typed)
                  self.send_btn = QPushButton("Ask")
                  self.send_btn.setObjectName("Primary")
                  self.send_btn.clicked.connect(self.send_typed)
                  row.addWidget(self.mic_btn)
                  row.addWidget(self.input, 1)
                  row.addWidget(self.send_btn)
                  root.addLayout(row)

                  self.footer = QLabel("Esc closes   ·   Ctrl+M mic   ·   Ctrl+L new chat")
                  self.footer.setObjectName("Muted")
                  self.footer.setAlignment(Qt.AlignmentFlag.AlignCenter)
                  root.addWidget(self.footer)

                  QShortcut(QKeySequence("Escape"), self).activated.connect(self.close)
                  QShortcut(QKeySequence("Ctrl+L"), self).activated.connect(self.new_chat)
                  QShortcut(QKeySequence("Ctrl+M"), self).activated.connect(self.toggle_mic)

                  if not self.have_voice:
                      self.mic_btn.setEnabled(False)
                      self.mic_btn.setToolTip("No microphone tool found (install pulseaudio-utils)")
                      self.hands_box.setChecked(False)
                      self.hands_box.setEnabled(False)
                  self.set_state("idle")
                  self.input.setFocus()

              # ------------------------------------------------------------ state
              def set_state(self, name, text=None):
                  self.state = name
                  color, label = STATES[name]
                  self.dot.setStyleSheet("color: " + color + "; font-size: 16px;")
                  self.state_lbl.setText(text or label)
                  self.mic_btn.setObjectName("MicOn" if name == "listening" else "Mic")
                  self.mic_btn.setStyleSheet("")
                  self.mic_btn.style().unpolish(self.mic_btn)
                  self.mic_btn.style().polish(self.mic_btn)
                  if name != "listening":
                      self.level.setValue(0)

              def _speak_toggled(self, on):
                  self.use_speech = on
                  if not on:
                      self.speaker.stop()

              def add_bubble(self, text, role):
                  bubble = Bubble(text, role)
                  row = QWidget()
                  rl = QHBoxLayout(row)
                  rl.setContentsMargins(0, 0, 0, 0)
                  if role == "user":
                      rl.addStretch()
                      rl.addWidget(bubble)
                  else:
                      rl.addWidget(bubble)
                      rl.addStretch()
                  self.msg_layout.insertWidget(self.msg_layout.count() - 1, row)
                  return bubble, row

              def new_chat(self):
                  if self.busy:
                      return
                  self.stop_everything()
                  self.history = []
                  while self.msg_layout.count() > 1:
                      item = self.msg_layout.takeAt(0)
                      if item.widget():
                          item.widget().deleteLater()
                  self.shot_row.hide()
                  self.set_state("idle")
                  self.input.setFocus()

              # ------------------------------------------------------------ listening
              def toggle_mic(self):
                  if self.recorder is not None and self.recorder.isRunning():
                      self.recorder.stop()   # sends what was said so far
                      return
                  if self.busy and self.state == "thinking":
                      return
                  self.speaker.stop()
                  self.start_listening()

              def start_listening(self):
                  if not self.have_voice or self.busy:
                      return
                  self.set_state("listening")
                  self.poll.stop()
                  rec = ui.Recorder(hands_free=True)
                  self.recorder = rec
                  rec.level.connect(lambda v: self.level.setValue(min(100, int(v / 30))))
                  rec.finished_wav.connect(lambda path, r=rec: self._heard(path, r))
                  rec.start()

              def _heard(self, path, rec):
                  if rec is not self.recorder or self.state != "listening":
                      if path:  # superseded or cancelled recording: discard it
                          try:
                              os.remove(path)
                          except OSError:
                              pass
                      return
                  self.recorder = None
                  if not path:
                      self.quiet_rounds += 1
                      if self.hands_free and self.quiet_rounds < MAX_QUIET_ROUNDS and self.state == "listening":
                          self.start_listening()
                          return
                      self.set_state("idle", "I did not hear anything. Tap the mic to try again.")
                      self.quiet_rounds = 0
                      return
                  self.quiet_rounds = 0
                  self.begin_turn(None, path)

              # ------------------------------------------------------------ turns
              def send_typed(self):
                  text = self.input.text().strip()
                  if not text or self.busy:
                      return
                  self.input.clear()
                  self.speaker.stop()
                  if self.recorder is not None:
                      self.recorder.cancel()
                      self.recorder = None
                  self.begin_turn(text, None)

              def begin_turn(self, text, audio_path, show_user=True):
                  if self.busy:
                      return
                  key = ui.load_api_key()
                  if not key:
                      self.add_bubble(
                          "**No Gemini API key yet.** Open **OneOS Welcome** and choose **Gemini API key**. It is free from Google AI Studio.",
                          "ai",
                      )
                      btn = QPushButton("Open OneOS Welcome")
                      btn.setObjectName("Primary")
                      btn.clicked.connect(lambda: subprocess.Popen([WELCOME], start_new_session=True))
                      self.msg_layout.insertWidget(self.msg_layout.count() - 1, btn, alignment=Qt.AlignmentFlag.AlignLeft)
                      self.set_state("idle")
                      return
                  self.busy = True
                  self.send_btn.setEnabled(False)
                  self.pending = (text, audio_path, key)
                  self.voice_turn = bool(audio_path)
                  self.set_state("thinking", "Looking at your screen..." if self.use_screen else "Thinking...")
                  if text and show_user:
                      self.add_bubble(text, "user")
                  if self.use_screen:
                      self.hide()
                      QTimer.singleShot(260, self._capture_and_send)
                  else:
                      self._dispatch(None)

              def _capture_and_send(self):
                  shot = grab_screen()
                  self.show()
                  self.raise_()
                  self.activateWindow()
                  b64 = image_to_b64(shot)
                  if b64:
                      self.thumb.setPixmap(shot.scaledToHeight(40, Qt.TransformationMode.SmoothTransformation))
                      self.shot_row.show()
                  self._dispatch(b64)

              def _dispatch(self, shot_b64):
                  text, audio_path, key = self.pending
                  self.pending = None
                  parts = []
                  if shot_b64:
                      parts.append({"inline_data": {"mime_type": "image/jpeg", "data": shot_b64}})
                  if audio_path:
                      try:
                          parts.append({"inline_data": {"mime_type": "audio/wav", "data": audio_to_b64(audio_path)}})
                      except OSError:
                          pass
                      finally:
                          try:
                              os.remove(audio_path)
                          except OSError:
                              pass
                      parts.append({"text": "(The user spoke this question. Answer it" + (" about the screenshot." if shot_b64 else ".") + ")"})
                  else:
                      parts.append({"text": text or "What is on my screen?"})
                  self.history.append({"role": "user", "parts": parts})
                  self.history = trim_history(self.history)
                  self.thinking = self.add_bubble("_Thinking..._", "ai")
                  self.worker = ui.FuncWorker(ui.gemini_generate, list(self.history), key, None, LIVE_PROMPT)
                  self.worker.done.connect(self._answered)
                  self.worker.start()

              def _answered(self, result):
                  self.busy = False
                  self.send_btn.setEnabled(True)
                  if self.thinking is not None:
                      self.thinking[1].deleteLater()
                      self.thinking = None
                  if isinstance(result, Exception):
                      if self.history and self.history[-1]["role"] == "user":
                          self.history.pop()
                      self.add_bubble("⚠️ " + str(result), "ai")
                      self.set_state("idle", "Something went wrong. Tap the mic or type to retry.")
                      return
                  heard, answer = split_heard(result)
                  # Replace the audio in the history with its transcript so later turns stay small
                  if self.history and self.history[-1]["role"] == "user":
                      parts = [p for p in self.history[-1]["parts"] if "inline_data" not in p or p["inline_data"]["mime_type"].startswith("image/")]
                      if heard:
                          parts = [p for p in parts if not p.get("text", "").startswith("(The user spoke")]
                          parts.append({"text": heard})
                      self.history[-1]["parts"] = parts
                      if heard:
                          self.add_bubble(heard, "user")
                  if self.voice_turn and not heard:
                      self.add_bubble("\U0001F3A4 (voice question)", "user")
                  self.history.append({"role": "model", "parts": [{"text": answer}]})
                  self.add_bubble(answer, "ai")
                  if self.use_speech:
                      self.speak(answer)
                  else:
                      self.after_reply()

              # ------------------------------------------------------------ speech output
              def speak(self, text):
                  self.set_state("speaking")
                  key = ui.load_api_key()
                  self.tts_worker = ui.FuncWorker(ui.tts_to_wav, text, key)
                  self.tts_worker.done.connect(lambda res, t=text: self._voice_ready(res, t))
                  self.tts_worker.start()

              def _voice_ready(self, result, text):
                  if not self.use_speech or self.state != "speaking":
                      if isinstance(result, str):
                          ui.Speaker._drop(result)
                      return
                  started = False
                  if isinstance(result, str):
                      started = self.speaker.play(result)
                  if not started:
                      started = self.speaker.say(text)  # offline voice
                  if started:
                      self.poll.start(200)
                  else:
                      self.after_reply()

              def _poll_speech(self):
                  if self.state != "speaking":
                      self.poll.stop()
                      return
                  if not self.speaker.speaking():
                      self.poll.stop()
                      self.after_reply()

              def after_reply(self):
                  self.set_state("idle")
                  if self.hands_free and self.have_voice and self.hands_box.isChecked():
                      QTimer.singleShot(250, self.start_listening)
                  else:
                      self.input.setFocus()

              # ------------------------------------------------------------ lifecycle
              def stop_everything(self):
                  self.poll.stop()
                  self.speaker.stop()
                  if self.recorder is not None:
                      self.recorder.cancel()
                      self.recorder.wait(1500)
                      self.recorder = None

              def closeEvent(self, event):
                  self.stop_everything()
                  super().closeEvent(event)
                  QApplication.instance().quit()

              def _apply_blur(self):
                  if self.glass:
                      ui.enable_blur_behind(self, self.card.geometry(), CARD_RADIUS)

              def showEvent(self, event):
                  super().showEvent(event)
                  QTimer.singleShot(80, self._apply_blur)

              def start(self):
                  if self.initial_ask:
                      shown = "Reading your screen..." if self.mode == "read" else self.initial_ask
                      self.add_bubble(shown, "user")
                      QTimer.singleShot(150, lambda: self.begin_turn(self.initial_ask, None, show_user=False))
                  elif self.hands_free and self.have_voice:
                      QTimer.singleShot(300, self.start_listening)


          def main():
              parser = argparse.ArgumentParser(description="OneOS Gemini Live")
              parser.add_argument("--mode", choices=sorted(MODES), default="live")
              parser.add_argument("--ask", default=None, help="Send this question as soon as the window opens")
              parser.add_argument("--no-speak", action="store_true", help="Do not read answers aloud")
              parser.add_argument("--no-listen", action="store_true", help="Do not start listening automatically")
              parser.add_argument("--no-screen", action="store_true", help="Do not attach screenshots")
              args = parser.parse_args()

              if single_instance(args.mode):
                  return 0
              app = QApplication(sys.argv)
              app.setApplicationName("Gemini Live")
              app.setDesktopFileName("oneos-gemini-live")
              app.setWindowIcon(QIcon.fromTheme("oneos-live"))
              app.setQuitOnLastWindowClosed(False)  # the window hides itself while taking the screenshot
              signal.signal(signal.SIGTERM, lambda *_: app.quit())
              heartbeat = QTimer()
              heartbeat.timeout.connect(lambda: None)
              heartbeat.start(400)

              window = LiveWindow(
                  args.mode,
                  ask=args.ask,
                  speak=False if args.no_speak else None,
                  listen=False if args.no_listen else None,
                  screen=False if args.no_screen else None,
              )
              window.show()
              window.raise_()
              window.activateWindow()
              window.start()
              code = app.exec()
              window.stop_everything()
              _remove_pid()
              sys.stdout.flush()
              os._exit(code)  # skips Qt teardown while a request thread may still be running


          if __name__ == "__main__":
              sys.exit(main())
